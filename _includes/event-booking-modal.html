<div class="event-booking-dialog" id="eventBookingDialog" hidden aria-hidden="true">
  <div class="event-booking-dialog__backdrop" data-event-booking-close></div>
  <section class="event-booking-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="eventBookingDialogTitle">
    <button class="event-booking-dialog__close" type="button" aria-label="Close registration form" data-event-booking-close>&times;</button>
    <p class="event-booking__eyebrow">EEG101 EVENT REGISTRATION</p>
    <h2 id="eventBookingDialogTitle">Register for an EEG101 event</h2>
    <p class="event-booking-dialog__details" id="eventBookingDialogDetails"></p>
    <p class="event-booking-form__notice" id="eventBookingFormNotice">No participant account is required. Once you register, your booking is confirmed on screen and you can add the event to your calendar straight away.</p>
    <p class="event-booking-form__message" id="eventBookingFormMessage" aria-live="polite"></p>
    <iframe class="event-booking-registration-frame" id="eventBookingRegistrationFrame" title="EEG101 event registration" hidden></iframe>
  </section>
</div>

<script>
(function () {
  var events = {{ site.data.events | jsonify }};
  var endpoint = {{ site.data.site.event_booking_endpoint | default: "" | jsonify }};
  var dialog = document.getElementById('eventBookingDialog');
  var message = document.getElementById('eventBookingFormMessage');
  var title = document.getElementById('eventBookingDialogTitle');
  var details = document.getElementById('eventBookingDialogDetails');
  var notice = document.getElementById('eventBookingFormNotice');
  var registrationFrame = document.getElementById('eventBookingRegistrationFrame');
  function findEvent(id) { return events.find(function (event) { return String(event.id) === String(id); }); }
  function canBook(event) { return event && event.booking_enabled === true && event.booking_status === 'open'; }
  function open(event) {
    if (!canBook(event)) return;
    message.textContent = '';
    notice.hidden = false;
    registrationFrame.style.minHeight = '';
    title.textContent = 'Register for ' + event.title;
    details.textContent = [event.start_date, event.time, event.location].filter(Boolean).join(' · ');
    if (!endpoint) {
      message.textContent = 'Registration is being prepared. Please check back shortly or contact eeg101costaction@gmail.com.';
      message.className = 'event-booking-form__message event-booking-form__message--error';
      registrationFrame.hidden = true;
    } else {
      var query = new URLSearchParams({ event_id: event.id, title: event.title, short_name: event.short_name || '', format: event.format || '', audience: event.audience || 'open', start_date: event.start_date, end_date: event.end_date || event.start_date, time: event.time || '', end_time: event.end_time || '', timezone: event.timezone || 'Europe/London', timezone_label: event.timezone_label || '', location: event.location || '', capacity: String(event.capacity || 0), summary: event.summary || '', privacy_url: '{{ "/privacy/" | absolute_url }}' });
      registrationFrame.src = endpoint + (endpoint.indexOf('?') >= 0 ? '&' : '?') + query.toString();
      registrationFrame.hidden = false;
    }
    dialog.hidden = false;
    dialog.setAttribute('aria-hidden', 'false');
  }
  function close() { dialog.hidden = true; dialog.setAttribute('aria-hidden', 'true'); registrationFrame.src = 'about:blank'; }
  window.EEG101EventBooking = { open: open, canBook: canBook };
  document.querySelectorAll('[data-event-booking]').forEach(function (button) { button.addEventListener('click', function () { open(findEvent(button.dataset.eventBooking)); }); });
  document.querySelectorAll('[data-event-booking-close]').forEach(function (button) { button.addEventListener('click', close); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && !dialog.hidden) close(); });
  // The Apps Script form runs inside Google's wrapper frames, so accept messages from any frame nested in ours.
  function fromRegistrationFrame(source) {
    for (var win = source, depth = 0; win && depth < 5; depth++) {
      if (win === registrationFrame.contentWindow) return true;
      if (win === win.parent) return false;
      win = win.parent;
    }
    return false;
  }
  window.addEventListener('message', function (messageEvent) {
    var data = messageEvent.data || {};
    if (data.type !== 'eeg101-event-registration' || !fromRegistrationFrame(messageEvent.source)) return;
    if (data.ok) {
      // The confirmation and calendar download are shown inside the form itself.
      notice.hidden = true;
      message.textContent = '';
      message.className = 'event-booking-form__message';
      registrationFrame.style.minHeight = '300px';
    } else {
      message.textContent = data.message || '';
      message.className = 'event-booking-form__message event-booking-form__message--error';
    }
  });
}());
</script>
