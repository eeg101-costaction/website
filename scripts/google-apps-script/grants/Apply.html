<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:wght@400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--primary:#000099;--primary-dark:#00007a;--primary-light:#e8e8ff;--gold:#FFCC00;--gold-dark:#d4a800;--gold-light:#fff8d6;--text:#1a1a2e;--muted:#5a5a7a;--bg:#faf8f5;--bg-alt:#f0ede8;--border:#e0dbd4;--error:#991b1b;--heading:'Playfair Display',Georgia,serif;--body:'Lora',Georgia,serif;--ui:'Lato',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.6 var(--body);margin:0;padding:4px}
h2{color:var(--primary);font:700 26px/1.2 var(--heading);margin:0 0 6px}
h3{font:700 17px var(--ui);margin:22px 0 8px}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.progress{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0;flex-wrap:wrap}
.progress li{font:700 12px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg-alt);border-radius:999px;padding:5px 11px}
.progress li.on{background:var(--primary);color:#fff}.progress li.past{background:var(--primary-light);color:var(--primary)}
label{display:block;font:700 14px var(--ui);margin:0 0 14px}
.hint{display:block;font:400 13px/1.5 var(--ui);color:var(--muted);margin-top:3px}
input,select,textarea{background:#fff;border:1px solid var(--border);border-radius:6px;color:var(--text);font:400 15px var(--ui);margin-top:6px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:2px solid var(--primary-light)}
.invalid{border-color:var(--error)!important;background:#fef2f2}
.grid{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}
fieldset{border:0;margin:0 0 16px;padding:0}legend{font:700 14px var(--ui);margin-bottom:6px;padding:0}
.choices{display:flex;flex-wrap:wrap;gap:8px 18px}
.choice{align-items:center;display:flex;font:400 15px var(--ui);gap:7px;margin:0}
.choice input{width:auto;margin:0;accent-color:var(--primary)}
.schemes{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.scheme{background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;display:block;margin:0;padding:16px 18px;font-weight:400}
.scheme:hover{border-color:var(--primary-light)}.scheme.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.scheme input{position:absolute;opacity:0;width:1px;height:1px}
.scheme strong{display:block;font:700 16px var(--ui);color:var(--primary)}
.scheme .amount{display:inline-block;background:var(--gold-light);border:1px solid var(--gold-dark);border-radius:999px;font:700 12px var(--ui);padding:2px 9px;margin:6px 0}
.scheme span.d{display:block;font:400 14px/1.5 var(--ui);color:var(--muted)}
.box{background:var(--bg-alt);border-radius:8px;font:400 14px/1.55 var(--ui);padding:12px 14px;margin:0 0 16px}
.box.warn{background:var(--gold-light);border:1px solid var(--gold-dark)}
.box ul,.scheme ul{margin:6px 0 0;padding-left:20px}.scheme ul{font:400 13px/1.45 var(--ui);color:var(--muted);padding-left:18px}
.scheme .link{display:block;margin-top:8px;text-align:left}
.doc a{display:block;margin-top:4px;font-weight:700;color:var(--primary)}
.scheme .who{display:block;font:700 13px/1.45 var(--ui);color:var(--text);margin-top:6px}
.counter{display:block;font:400 12px var(--ui);color:var(--muted);text-align:right;margin-top:3px}.counter.over{color:var(--error);font-weight:700}
table.budget{border-collapse:collapse;width:100%;font:400 14px var(--ui);margin-bottom:8px}
table.budget th{text-align:left;font-weight:700;color:var(--muted);padding:4px 6px}
table.budget td{padding:4px 6px;vertical-align:top}
table.budget td input,table.budget td select{margin-top:0}
.total{font:700 16px var(--ui);display:flex;justify-content:space-between;border-top:2px solid var(--text);padding-top:8px;margin:6px 0 16px}
.total.over{color:var(--error)}
.btn{background:var(--primary);border:2px solid var(--primary);border-radius:6px;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:700 14.4px var(--ui);padding:.6rem 1.4rem;text-decoration:none}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.secondary{background:#fff;color:var(--primary)}.btn.secondary:hover{background:var(--primary-light)}
.btn.small{font-size:13px;padding:.35rem .8rem}.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--primary);cursor:pointer;font:700 13px var(--ui);padding:0;text-decoration:underline}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
.errors{background:#fef2f2;border:1px solid var(--error);border-radius:8px;color:var(--error);font:700 14px/1.5 var(--ui);padding:10px 14px;margin:0 0 16px}
.errors ul{margin:4px 0 0;padding-left:20px;font-weight:400}
.doc{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 0 12px;font:400 14px var(--ui)}
.doc strong{display:block}.doc .status{display:block;margin-top:6px;color:var(--muted)}.doc .status.ok{color:#15803d;font-weight:700}.doc .status.bad{color:var(--error);font-weight:700}
.doc input[type=file]{border:0;padding:6px 0;background:none}
.summary{background:#fff;border:1px solid var(--border);border-radius:10px;font:400 14px/1.5 var(--ui);padding:14px 18px;margin-bottom:16px}
.summary dl{display:grid;grid-template-columns:38% 1fr;gap:4px 12px;margin:0}.summary dt{color:var(--muted)}.summary dd{margin:0}
.consent{align-items:flex-start;background:var(--bg-alt);border-radius:6px;display:flex;gap:10px;font:400 14px/1.55 var(--ui);margin-bottom:10px;padding:12px}
.consent input{width:auto;margin-top:4px;accent-color:var(--primary)}
.done{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,100,.08);padding:22px 24px}
.done .ref{font:700 20px var(--ui);color:var(--primary)}
.downloads{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.trap{display:none}
.saved{font:400 12px var(--ui);color:var(--muted)}
@media(max-width:600px){.grid,.schemes{grid-template-columns:1fr}.summary dl{grid-template-columns:1fr}table.budget thead{display:none}table.budget tr{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--border);padding:6px 0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CONFIG = <?!= boot ?>;
const STEPS = ['Funding scheme', 'About you', 'Activity and dates', 'Proposal', 'Budget', 'Documents', 'Check and submit'];
const DRAFT_KEY = 'eeg101-grant-application-draft';
const app = document.getElementById('app');
let step = 0;
let state = loadDraft() || { scheme: '', call: '', working_groups: [], budget: [], documents: {} };
state.documents = {}; // files are never kept between visits: upload them again
// Calls can close, and a draft can come from an older version of the form.
if (!CONFIG.calls.some(c => (c.id === state.call || (!state.call && CONFIG.calls.length === 1)) && c.schemes.indexOf(state.scheme) >= 0)) { state.call = ''; state.scheme = ''; }
// A link can choose the call (?call=), the scheme (?scheme=), or both.
const linked = CONFIG.calls.filter(c => (!CONFIG.preselectCall || c.id === CONFIG.preselectCall) && (!CONFIG.preselect || c.schemes.indexOf(CONFIG.preselect) >= 0));
if (CONFIG.preselectCall || CONFIG.preselect) {
  const c = linked.length === 1 ? linked[0] : null;
  if (c) { state.call = c.id; state.scheme = CONFIG.preselect || (c.schemes.length === 1 ? c.schemes[0] : (c.schemes.indexOf(state.scheme) >= 0 ? state.scheme : '')); if (!state.scheme) state.call = c.id; }
}
// With several calls open and a link to one scheme, show the calls offering it.
let onlyScheme = !CONFIG.preselectCall && CONFIG.preselect && linked.length > 1 ? CONFIG.preselect : '';
// A link to one call (e.g. sent to a company's contacts) shows only that call.
let onlyCall = CONFIG.preselectCall || '';
function currentCall() { return CONFIG.calls.filter(c => c.id === state.call)[0] || (CONFIG.calls.length === 1 ? CONFIG.calls[0] : null); }
function callQuestions() { const c = currentCall(); return c ? c.questions || [] : []; }
function allDocuments() { const c = currentCall(); return scheme().documents.concat((c && c.documents || []).map(d => ({ id: 'call_' + d.id, label: d.label, required: !!d.required }))); }
function periodEnd() { const c = currentCall(); return c ? c.periodEnd : ''; }
function periodEndText() { const c = currentCall(); return c ? c.periodEndText : ''; }

function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function words(t) { return (String(t || '').trim().match(/\S+/g) || []).length; }
function scheme() { return CONFIG.schemes[state.scheme]; }
function money(n) { return '€' + (Number(n) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(iso) { if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return ''; const d = new Date(iso + 'T12:00:00Z'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
function days(a, b) { if (!a || !b) return 0; return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000) + 1; }
function maxOf() { const s = scheme(); return s.maxOnline && state.attendance === 'Online' ? s.maxOnline : s.max; }
function categories() { const s = scheme(); return s.budgetOnline && state.attendance === 'Online' ? s.budgetOnline : s.budget; }
function euros(n) { return '€' + Number(n).toLocaleString('en-GB'); }
function amountText(s) { return s.maxOnline ? `Up to ${euros(s.max)} in person · ${euros(s.maxOnline)} online` : `Up to ${euros(s.max)}`; }
function countryNote(c) {
  if (!c) return '';
  if (CONFIG.itc.indexOf(c) >= 0) return `${c} is an Inclusiveness Target Country (ITC).`;
  if (CONFIG.nnc.indexOf(c) >= 0) return `${c} is a COST Near Neighbour Country.`;
  if (CONFIG.costMembers.indexOf(c) >= 0) return '';
  return `${c} is not a COST Member or Near Neighbour Country, so COST grants are normally not available. You can still apply, and reviewers will check.`;
}
function total() { return Math.round((state.budget || []).reduce((s, l) => s + (Number(l.amount) || 0), 0) * 100) / 100; }

function loadDraft() { try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return d && typeof d === 'object' ? d : null; } catch (e) { return null; } }
function saveDraft() { try { const copy = Object.assign({}, state, { documents: {} }); localStorage.setItem(DRAFT_KEY, JSON.stringify(copy)); } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

// The page sits in an iframe on www.eeg101.eu: tell it how tall to be, and when
// to scroll back to the top of the form.
// Measure the form itself, not the page: the page is at least as tall as the
// frame, so measuring it would never let the frame shrink.
function tellParent(type) { try { window.top.postMessage({ type: type, height: Math.ceil(app.getBoundingClientRect().height) + 16 }, '*'); } catch (e) {} }
new ResizeObserver(() => tellParent('eeg101-grant-height')).observe(app);

/* -------------------------------------------------------------- fields */

function field(name, label, opts) {
  opts = opts || {};
  const value = state[name] == null ? '' : state[name];
  const hint = opts.hint ? `<span class="hint">${opts.hint}</span>` : '';
  const attrs = `name="${name}" id="f_${name}"${opts.required === false ? '' : ' required'}${opts.attrs ? ' ' + opts.attrs : ''}`;
  if (opts.type === 'select') {
    return `<label>${label}${hint}<select ${attrs}><option value="">Select…</option>${opts.options.map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  }
  if (opts.type === 'textarea') {
    const limit = opts.words ? `<span class="counter" data-for="${name}" data-limit="${opts.words}"></span>` : '';
    return `<label>${label}${hint}<textarea ${attrs}>${esc(value)}</textarea>${limit}</label>`;
  }
  return `<label>${label}${hint}<input type="${opts.type || 'text'}" value="${esc(value)}" ${attrs}></label>`;
}

function radios(name, legend, options, hint) {
  return `<fieldset><legend>${legend}</legend>${hint ? `<span class="hint" style="margin:-4px 0 8px">${hint}</span>` : ''}<div class="choices">${options.map(o => `<label class="choice"><input type="radio" name="${name}" value="${esc(o)}"${state[name] === o ? ' checked' : ''}> ${esc(o)}</label>`).join('')}</div></fieldset>`;
}

/* --------------------------------------------------------------- steps */

function schemeCard(call, id) {
  const s = CONFIG.schemes[id];
  const on = state.scheme === id && (state.call === call.id || (!state.call && CONFIG.calls.length === 1));
  const docs = s.documents.concat((call.documents || []).map(d => ({ label: d.label })));
  return `<label class="scheme${on ? ' on' : ''}"><input type="radio" name="pick" value="${esc(call.id)}|${id}"${on ? ' checked' : ''}><strong>${esc(s.title)}</strong><span class="amount">${amountText(s)}</span><span class="d">${esc(s.blurb)}</span>${call.host && s.kind === 'stsm' ? `<span class="who">Host: ${esc(call.host.institution)}${call.host.country ? ', ' + esc(call.host.country) : ''}</span>` : ''}<span class="who">For: ${esc(s.who)}</span><ul>${s.rules.map(r => `<li>${esc(r)}</li>`).join('')}<li>${s.minDays}–${s.maxDays} days. You will need: ${docs.map(d => { const l = d.label.split(' (')[0].split(',')[0].replace(/^Your /, ''); return l === 'CV' ? l : l.charAt(0).toLowerCase() + l.slice(1); }).join(', ')}.</li></ul><button type="button" class="link" data-template="${esc(call.id)}|${id}">Download a Word template to prepare offline</button></label>`;
}

// A Word version of the whole form for one call and scheme, to draft answers
// offline. It is HTML saved as .doc, which Word opens and edits.
function wordTemplate(call, id) {
  const s = CONFIG.schemes[id];
  const e = esc;
  const row = (label, hint) => `<tr><td class="l" width="40%" bgcolor="#f0ede8">${e(label)}${hint ? `<br><span class="h">${e(hint)}</span>` : ''}</td><td class="v">&nbsp;</td></tr>`;
  const box = (label, words, hint) => `<h3>${e(label)}${words ? ` <span class="h">(up to ${words} words)</span>` : ''}</h3>${hint ? `<p class="h">${e(hint)}</p>` : ''}<table class="box" border="1" cellpadding="6" cellspacing="0" width="100%"><tr><td height="80">&nbsp;<br>&nbsp;<br>&nbsp;<br>&nbsp;</td></tr></table>`;
  const max = s.maxOnline ? `€${s.max.toLocaleString('en-GB')} in person, or €${s.maxOnline.toLocaleString('en-GB')} online` : `€${s.max.toLocaleString('en-GB')}`;
  let activity = row('Start date') + row('End date', `${s.minDays}–${s.maxDays} days, ending by ${call.periodEndText}`);
  if (s.kind === 'stsm') {
    const h = call.host || {};
    activity += row(s.industry ? 'Host (named lead at the organisation)' : 'Host (academic lead)', h.name ? `Set by this call: ${h.name}` : 'Must be an EEG101 member') + row('Host email')
      + row(s.industry ? 'Host company or organisation' : 'Host institution', h.institution ? `Set by this call: ${h.institution}` : '') + row('Host country', h.country ? `Set by this call: ${h.country}` : 'Must differ from your own institution\'s country')
      + (s.industry ? row('Type of organisation', h.type ? `Set by this call: ${h.type}` : CONFIG.industryTypes.join(' / ')) : '') + row('Is your host an EEG101 member?', 'Yes / No');
  } else if (s.kind === 'vmg') {
    activity += row('Who will you collaborate with?', 'Names, roles and institutions') + row('Is a third-party organisation involved?', 'Yes / No; if yes, its named lead must be an EEG101 member')
      + row('This work is not part of a leadership role I hold in EEG101', 'Confirm');
  } else {
    activity += row('Conference name') + row('Conference web address') + row('Organised entirely by others, not by EEG101 or another COST Action?', 'Must be Yes')
      + row('Attendance', 'Face to face / Online') + row('City and country', 'If face to face') + row('Title of your presentation') + row('Type of presentation', s.presentations.join(' / ')) + row('Abstract status', 'Accepted / Submitted, awaiting decision');
  }
  const qs = s.questions.map(q => box(q.label, CONFIG.words[q.id], q.hint)).join('')
    + (call.questions || []).map(q => box(q.label + (q.required ? '' : ' (optional)'), q.words || 300, q.hint)).join('');
  const docs = s.documents.concat((call.documents || []).map(d => ({ label: d.label, required: d.required })));
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${e(s.title)}: application template</title>
<style>body{font-family:Arial,sans-serif;font-size:11pt;color:#1a1a2e}h1{color:#000099;font-size:17pt;margin:6pt 0}h2{color:#000099;font-size:13pt;border-bottom:2pt solid #FFCC00;margin-top:16pt}h3{font-size:11pt;margin:10pt 0 2pt}
.band{background:#000099;color:#ffffff;padding:8pt}.h{color:#5a5a7a;font-size:9.5pt;font-weight:normal}table{border-collapse:collapse;width:100%}td{border:1pt solid #c8c3bb;padding:5pt;vertical-align:top}td.l{width:40%;background:#f0ede8}.box td{height:60pt}</style></head><body>
<table width="100%" cellpadding="8" cellspacing="0"><tr><td bgcolor="#000099" style="color:#ffffff"><font color="#ffffff"><b>EEG101 · Fundamentals of Open &amp; Rigorous EEG Science</b><br>COST Action CA24148 · ${e(call.name)}</font></td></tr></table>
<h1>${e(s.title)}: application template</h1>
<p>${call.deadlineText ? `<b>Deadline:</b> ${e(call.deadlineText)}. ` : ''}<b>Activities must end by</b> ${e(call.periodEndText)}. <b>Maximum:</b> ${max}.</p>
<p class="h">Use this to prepare your application offline. Applications are accepted only through the online form at www.eeg101.eu/grants/apply/: when your answers are ready, copy them into the form, upload your documents and submit. Keep within the word limits; the form will not accept longer answers.</p>
<h2>1. About you</h2><table border="1" cellpadding="5" cellspacing="0" width="100%">${row('First and last name')}${row('Email')}${row('Current position')}${row('Career stage')}${row('Institution and department')}${row('Country of your institution')}${row('ORCID iD (optional)')}${row('Are you under 40? (Young Researcher and Innovator)', 'Yes / No')}${row('Are you an early-career researcher?', 'PhD student, or PhD within the last 8 years (excluding career breaks)')}${row('Gender', 'Prefer not to say is always an option')}${row('Are you a member of the EEG101 COST Action?', 'You must be, to apply')}${row('Working Groups (if a member)', CONFIG.workingGroups.join(' / '))}</table>
<h2>2. Activity and dates</h2><table border="1" cellpadding="5" cellspacing="0" width="100%">${activity}</table>
<h2>3. Your proposal</h2>${box('Title', 0, '')}${qs}
<h2>4. Budget</h2><p class="h">In euros, up to ${max} in total. Categories: ${e(s.budget.join(', '))}${s.budgetOnline ? ` (online: ${e(s.budgetOnline.join(', '))})` : ''}. Grants do not cover salaries or other employment costs.</p>
<table border="1" cellpadding="5" cellspacing="0" width="100%"><tr><td class="l"><b>Category</b></td><td class="l"><b>What it covers</b></td><td class="l"><b>Amount (€)</b></td></tr>${'<tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>'.repeat(5)}<tr><td colspan="2"><b>Total</b></td><td>&nbsp;</td></tr></table>
${box('Justification of costs', CONFIG.words.justification, 'How you estimated each cost (quotes, typical prices, daily rates), so reviewers can judge whether it is reasonable.')}
<h2>5. Documents to upload (PDF, up to ${CONFIG.maxFileMb} MB each)</h2><ul>${docs.map(d => `<li>${e(d.label)}${d.required === false ? ' (optional)' : ''}${d.template ? ` · template: ${e(d.template)}` : ''}</li>`).join('')}</ul>
<h2>6. Please check</h2><ul>${s.rules.map(r => `<li>${e(r)}</li>`).join('')}<li>If your application is accepted, you will then apply through COST's online platform, e-COST, with the same details.</li></ul>
</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + html], { type: 'application/msword' }));
  a.download = `EEG101 ${s.short} application template - ${call.name}.doc`.replace(/[\\/:*?"<>|]+/g, '-');
  document.body.appendChild(a); a.click(); a.remove();
}

function callIntro(c) {
  return `${c.deadlineText ? `Applications close on <strong>${esc(c.deadlineText)}</strong>.` : ''} Every funded activity must be completed by <strong>${esc(c.periodEndText)}</strong>.${c.description ? `<br>${esc(c.description)}` : ''}`;
}

function viewScheme() {
  const calls = CONFIG.calls.filter(c => (!onlyScheme || c.schemes.indexOf(onlyScheme) >= 0) && (!onlyCall || c.id === onlyCall));
  const single = calls.length === 1;
  return `<h2>Choose a funding scheme</h2>
  ${single ? `<p class="lead">${esc(calls[0].name)}. ${callIntro(calls[0])}${CONFIG.calls.length > 1 ? ` <button type="button" class="link" id="allCalls">See all ${CONFIG.calls.length} open calls</button>` : ''}</p><div class="schemes">${calls[0].schemes.filter(id => !onlyScheme || id === onlyScheme).map(id => schemeCard(calls[0], id)).join('')}</div>`
    : `<p class="lead">${CONFIG.calls.length} calls are open. Choose the call and the scheme you are applying to.${onlyScheme ? ` Showing the calls that offer the ${esc(CONFIG.schemes[onlyScheme].title)}. <button type="button" class="link" id="allCalls">Show all open calls</button>` : ''}</p>
      ${calls.map(c => `<h3>${esc(c.name)}</h3><p class="hint" style="margin-top:-4px">${callIntro(c)}</p><div class="schemes">${c.schemes.filter(id => !onlyScheme || id === onlyScheme).map(id => schemeCard(c, id)).join('')}</div>`).join('')}`}
  <div class="box"><strong>Before you start</strong><ul>
    <li>Each scheme has a <strong>Word template</strong> (the link on its card above) with every question, word limit and document, so you can prepare your answers offline, then come back to submit them here.</li>
    <li>You must be a member of the EEG101 COST Action. Not a member yet? <a href="https://www.eeg101.eu/join/" target="_blank" rel="noopener">Join through e-COST first</a>.</li>
    <li>Your institution should be in a COST Full or Cooperating Member country or a Near Neighbour Country.</li>
    <li>The activity must start after today and end by the date its call gives, within one grant period.</li>

const VIEWS = [viewScheme, viewAbout, viewActivity, viewProposal, viewBudget, viewDocuments, viewReview];

/* ---------------------------------------------------------- validation */

function problems() {
  const out = [];
  const need = (keys, message) => { if (keys.some(k => !String(state[k] || '').trim())) out.push(message); };
  const s = scheme();
  if (step === 0 && (!s || !currentCall())) out.push(CONFIG.calls.length > 1 ? 'Choose a call and a funding scheme.' : 'Choose a funding scheme.');
  if (step === 1) {
    need(['first_name', 'last_name', 'email', 'position', 'career_stage', 'institution', 'country', 'gender'], 'Complete every required field.');
    if (state.email && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(state.email)) out.push('Check your email address.');
    if (!state.yri || !state.eci) out.push('Answer the two career questions.');
    if (state.member !== 'Yes') out.push('Only members of the EEG101 COST Action can apply.');
  }
  if (step === 2) {
    if (!state.start_date || !state.end_date) out.push('Give a start and an end date.');
    else {
      const n = days(state.start_date, state.end_date);
      if (state.start_date < CONFIG.today) out.push('The start date cannot be in the past.');
      if (state.end_date < state.start_date) out.push('The end date is before the start date.');
      else if (state.end_date > periodEnd()) out.push(`Everything must be finished by ${periodEndText()}.`);
      else if (n < s.minDays || n > s.maxDays) out.push(`A ${s.short} lasts ${s.minDays}–${s.maxDays} days; yours is ${n}.`);
    }
    if (s.kind === 'stsm') {
      need(['host_name', 'host_email', 'host_institution', 'host_country'].concat(s.industry ? ['host_type'] : []), 'Give your host\'s details.');
      if (state.host_country && state.host_country === state.country) out.push('Your host must be in a different country from your own institution.');
      if (state.host_member !== 'Yes') out.push('Your host must be a member of EEG101 before you apply.');
    } else if (state.scheme === 'vmg') {
      need(['collaborators'], 'List your collaborators.');
      if (!state.third_party) out.push('Say whether a third-party organisation is involved.');
      if (state.third_party === 'Yes' && state.third_party_member !== 'Yes') out.push('The lead at the third-party organisation must be a member of EEG101.');
      if (!state.not_leadership) out.push('Confirm that this work is not part of a leadership role in EEG101.');
    } else {
      need(['conference_name', 'contribution_title', 'presentation', 'abstract_status', 'attendance'].concat(state.attendance === 'Face to face' ? ['conference_location', 'conference_country'] : []), 'Complete the conference details.');
      if (state.third_party_organised !== 'Yes') out.push('Conference grants are only for conferences organised entirely by others.');
      if (state.presentation && s.presentations.indexOf(state.presentation) < 0) out.push('Choose the type of presentation again.');
      if (state.scheme === 'itc_conference' && state.country && CONFIG.itc.indexOf(state.country) < 0 && CONFIG.nnc.indexOf(state.country) < 0) out.push(`ITC Conference Grants are only for institutions in Inclusiveness Target Countries or Near Neighbour Countries, and ${state.country} is neither. A YRI or Dissemination Conference Grant may suit you instead.`);
      if (state.scheme === 'yri_conference' && state.yri !== 'Yes') out.push('YRI Conference Grants are only for Young Researchers and Innovators (under 40).');
      if (state.conference_url && !/^https?:\/\/\S+$/i.test(state.conference_url)) out.push('The conference web address should start with https://.');
    }
  }
  if (step === 3) {
    need(['title'].concat(s.questions.map(q => q.id)), 'Answer every question.');
    s.questions.forEach(q => { if (words(state[q.id]) > CONFIG.words[q.id]) out.push(`Shorten "${q.label}" to ${CONFIG.words[q.id]} words.`); });
    callQuestions().forEach(q => {
      if (q.required && !String(state['q_' + q.id] || '').trim()) out.push(`Answer "${q.label}".`);
      if (words(state['q_' + q.id]) > (q.words || 300)) out.push(`Shorten "${q.label}" to ${q.words || 300} words.`);
    });
  }
  if (step === 4) {
    const lines = (state.budget || []).filter(l => l.category || l.description || l.amount);
    if (!lines.length) out.push('Add at least one budget line.');
    if (lines.some(l => !l.category || !String(l.description || '').trim() || !(Number(l.amount) > 0))) out.push('Give every budget line a category, a description and an amount.');
    if (lines.some(l => l.category && categories().indexOf(l.category) < 0)) out.push('Choose the category of each line again: the options depend on how you attend.');
    if (total() > maxOf()) out.push(`The total is more than the ${euros(maxOf())} maximum.`);
    if (!String(state.justification || '').trim()) out.push('Justify your costs.');
    if (words(state.justification) > CONFIG.words.justification) out.push(`Shorten the justification to ${CONFIG.words.justification} words.`);
  }
  if (step === 5) {
    allDocuments().forEach(d => { const needed = d.required || (d.requiredIf && state[d.requiredIf] === 'Yes'); if (needed && !state.documents[d.id]) out.push(`Upload: ${d.label}.`); });
    if (document.querySelector('.status.busy')) out.push('Wait for your files to finish uploading.');
  }
  if (step === 6) {
    if (!state.confirm_accurate || !state.confirm_rules || !state.confirm_privacy) out.push('Tick all three declarations.');
    if (!String(state.signature || '').trim()) out.push('Type your name as your signature.');
  }
  return out;
}

/* ------------------------------------------------------------- rendering */

function render(errors) {
  app.innerHTML = `<ol class="progress">${STEPS.map((s, i) => `<li class="${i === step ? 'on' : i < step ? 'past' : ''}">${i + 1}. ${esc(s)}</li>`).join('')}</ol>
  ${errors && errors.length ? `<div class="errors" role="alert">Please fix the following:<ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
  <form id="form" novalidate>${VIEWS[step]()}
  <div class="nav"><span>${step > 0 ? '<button type="button" class="btn secondary" id="back">← Back</button>' : ''}</span>
  <span style="display:flex;align-items:center;gap:12px"><span class="saved">Your answers are kept on this device until you submit.</span>
  <button type="submit" class="btn" id="next">${step === STEPS.length - 1 ? 'Submit application' : 'Continue →'}</button></span></div></form>`;
  bind();
  refresh();
}

function refresh() {
  document.querySelectorAll('.counter').forEach(c => { const n = words(state[c.dataset.for]); c.textContent = `${n} / ${c.dataset.limit} words`; c.classList.toggle('over', n > Number(c.dataset.limit)); });
  const itc = document.getElementById('itcNote');
  if (itc) itc.textContent = countryNote(state.country);
  const dn = document.getElementById('daysNote');
  if (dn) dn.textContent = state.start_date && state.end_date && state.end_date >= state.start_date ? `${days(state.start_date, state.end_date)} days` : '';
  const tv = document.getElementById('totalValue');
  if (tv) { tv.textContent = `${money(total())} of ${money(maxOf())}`; document.getElementById('totalLine').classList.toggle('over', total() > maxOf()); }
  const f2f = document.getElementById('f2fWrap'); if (f2f) f2f.hidden = state.attendance !== 'Face to face';
  const g = document.getElementById('genderOtherWrap'); if (g) g.hidden = state.gender !== 'Prefer to self-describe';
  const m = document.getElementById('memberNote'); if (m) m.hidden = state.member !== 'No';
  const wg = document.getElementById('wgWrap'); if (wg) wg.hidden = state.member !== 'Yes';
  const t = document.getElementById('thirdPartyWrap'); if (t) t.hidden = state.third_party !== 'Yes';
}

function bind() {
  const form = document.getElementById('form');
  form.addEventListener('input', onChange);
  form.addEventListener('change', onChange);
  form.addEventListener('submit', e => { e.preventDefault(); next(); });
  form.querySelectorAll('[data-template]').forEach(b => b.addEventListener('click', ev => {
    ev.preventDefault(); ev.stopPropagation();
    const [callId, id] = b.dataset.template.split('|');
    wordTemplate(CONFIG.calls.filter(c => c.id === callId)[0], id);
  }));
  const allCalls = document.getElementById('allCalls');
  if (allCalls) allCalls.addEventListener('click', () => { onlyScheme = ''; onlyCall = ''; render(); });
  const back = document.getElementById('back');
  if (back) back.addEventListener('click', () => go(step - 1));
  const add = document.getElementById('addLine');
  if (add) add.addEventListener('click', () => { state.budget.push({ category: '', description: '', amount: '' }); saveDraft(); render(); });
  form.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { state.budget.splice(Number(b.dataset.remove), 1); saveDraft(); render(); }));
  form.querySelectorAll('input[type=file]').forEach(input => input.addEventListener('change', () => upload(input)));
}

function onChange(e) {
  const el = e.target;
  if (!el.name && !el.dataset.line) return;
  if (el.type === 'file') return;
  if (el.dataset.line != null) { state.budget[Number(el.dataset.line)][el.dataset.key] = el.value; }
  else if (el.name === 'working_groups') { state.working_groups = Array.from(document.querySelectorAll('input[name=working_groups]:checked')).map(x => x.value); }
  else if (el.type === 'checkbox') { state[el.name] = el.checked; }
  else if (el.type === 'radio') { if (el.checked) state[el.name] = el.value; }
  else { state[el.name] = el.value; }
  if (el.name === 'pick') {
    const [call, id] = el.value.split('|');
    if (call !== state.call || id !== state.scheme) { state.budget = []; state.documents = {}; }
    if (call !== state.call) ['host_institution', 'host_country', 'host_type', 'host_name'].forEach(k => { delete state[k]; });
    state.call = call; state.scheme = id; delete state.pick;
    document.querySelectorAll('.scheme').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
  }
  el.classList.remove('invalid');
  saveDraft();
  refresh();
}

function go(n) { step = Math.max(0, Math.min(STEPS.length - 1, n)); render(); tellParent('eeg101-grant-scroll'); }

function next() {
  const errors = problems();
  if (errors.length) { render(errors); tellParent('eeg101-grant-scroll'); return; }
  if (step < STEPS.length - 1) go(step + 1); else submit();
}

/* ------------------------------------------------------------- uploads */

function upload(input) {
  const file = input.files && input.files[0];
  const status = document.getElementById('status_' + input.dataset.doc);
  if (!file) return;
  if (!/\.pdf$/i.test(file.name)) { status.className = 'status bad'; status.textContent = 'Please choose a PDF file.'; return; }
  if (file.size > CONFIG.maxFileMb * 1024 * 1024) { status.className = 'status bad'; status.textContent = `That file is larger than ${CONFIG.maxFileMb} MB.`; return; }
  status.className = 'status busy'; status.textContent = 'Uploading…';
  const reader = new FileReader();
  reader.onload = () => {
    const data = String(reader.result).split(',')[1];
    google.script.run
      .withSuccessHandler(r => { state.documents[input.dataset.doc] = r; status.className = 'status ok'; status.textContent = '✓ Uploaded: ' + r.name; })
      .withFailureHandler(err => { delete state.documents[input.dataset.doc]; status.className = 'status bad'; status.textContent = (err && err.message) || 'The upload failed. Please try again.'; })
      .uploadFile({ name: file.name, data: data });
  };
  reader.onerror = () => { status.className = 'status bad'; status.textContent = 'That file could not be read.'; };
  reader.readAsDataURL(file);
}

/* -------------------------------------------------------------- submit */

// The CAPTCHA runs on www.eeg101.eu/grants/apply/, around this form: ask that
// page for a token, and wait while the person completes it if asked to.
function captchaToken() {
  return new Promise((resolve, reject) => {
    const site = new URL(CONFIG.applyPage).origin;
    const give = setTimeout(() => { window.removeEventListener('message', on); reject(new Error(`The check that you are not a robot did not load. Please open this form from ${CONFIG.applyPage} and submit again; your answers are kept.`)); }, 180000);
    function on(e) {
      if (e.origin !== site || !e.data || e.data.type !== 'eeg101-grant-token') return;
      clearTimeout(give); window.removeEventListener('message', on);
      if (e.data.token) resolve(e.data.token); else reject(new Error('The check that you are not a robot did not work. Please submit again.'));
    }
    window.addEventListener('message', on);
    try { window.top.postMessage({ type: 'eeg101-grant-token-request' }, '*'); } catch (err) { clearTimeout(give); reject(err); }
  });
}

async function submit() {
  const button = document.getElementById('next');
  const failed = err => { button.disabled = false; button.textContent = 'Submit application'; render([(err && err.message) || 'Your application could not be submitted. Please try again.']); tellParent('eeg101-grant-scroll'); };
  button.disabled = true; button.textContent = CONFIG.captcha ? 'Checking…' : 'Submitting…';
  const payload = Object.assign({}, state, { call: currentCall().id, started: CONFIG.started, startedSig: CONFIG.startedSig, website: (document.querySelector('[name=website]') || {}).value || '' });
  payload.budget = (state.budget || []).filter(l => l.category || l.description || l.amount);
  if (CONFIG.captcha) {
    try { payload.captcha = await captchaToken(); } catch (err) { failed(err); return; }
    button.textContent = 'Submitting…';
  }
  google.script.run.withSuccessHandler(done).withFailureHandler(failed).submitApplication(payload);
}

function done(result) {
  clearDraft();
  const pdfUrl = URL.createObjectURL(new Blob([Uint8Array.from(atob(result.pdf), c => c.charCodeAt(0))], { type: 'application/pdf' }));
  app.innerHTML = `<div class="done" role="status"><h2>Application submitted</h2>
  <p class="ref">${esc(result.id)}</p>
  <p>Thank you. We received your application on ${esc(result.submitted)}. ${result.emailed ? `A confirmation with a PDF copy has been sent to <strong>${esc(result.email)}</strong>.` : `We could not send the confirmation email just now, so please download your copy below. We have your application.`}</p>
  <div class="downloads"><a class="btn" href="${pdfUrl}" download="${esc(result.id)} application.pdf">Download PDF</a></div>
  <h3>What happens next</h3>
  <ul><li>The grants committee reviews your application. ${esc(result.timing || '')} You do not need to do anything in e-COST yet.</li>
  <li>If your application is accepted, we will ask you to apply through COST's online platform, <a href="https://e-services.cost.eu/" target="_blank" rel="noopener">e-COST</a>, with the same details and your CV in your e-COST profile. You then receive a grant letter.</li>
  <li> After the activity, you report in e-COST within 30 days, and the grant is paid once the report is approved.</li></ul>
  <p class="hint">Please quote ${esc(result.id)} if you contact us. Questions: <a href="mailto:${esc(CONFIG.contact)}">${esc(CONFIG.contact)}</a>.</p></div>`;
  tellParent('eeg101-grant-scroll');
}

/* ---------------------------------------------------------------- start */

if (!CONFIG.open) {
  app.innerHTML = `<div class="done"><h2>Applications are closed</h2><p>No EEG101 funding call is open for applications at the moment. Calls are announced on the <a href="https://www.eeg101.eu/grants/">Grants page</a>.</p></div>`;
} else {
  render();
}
</script>
