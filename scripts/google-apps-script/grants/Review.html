<!doctype html>
<html lang="en">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--primary:#000099;--primary-dark:#00007a;--primary-light:#e8e8ff;--gold:#FFCC00;--gold-dark:#d4a800;--gold-light:#fff8d6;--text:#1a1a2e;--muted:#5a5a7a;--bg:#faf8f5;--bg-alt:#f0ede8;--border:#e0dbd4;--error:#991b1b;--ok:#15803d;--ui:'Lato',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);margin:0}
header{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
header h1{font:700 22px 'Playfair Display',Georgia,serif;color:var(--primary);margin:0}
header .me{color:var(--muted);font-size:13px;margin-left:auto}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;font:700 14px var(--ui);padding:8px 12px}
nav.tabs button.on{border-color:var(--gold);color:var(--primary)}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{border:1px solid var(--border);border-radius:6px;font:400 14px var(--ui);padding:7px 10px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px}
th{background:var(--bg-alt);font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--primary-light)}
.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px;background:var(--bg-alt);color:var(--muted);white-space:nowrap}
.pill.ok{background:#dcfce7;color:var(--ok)}.pill.todo{background:var(--gold-light);color:#8a6d00}.pill.coi{background:#fde2e2;color:var(--error)}
.pill.funded{background:#dcfce7;color:var(--ok)}.pill.reserve{background:var(--gold-light);color:#8a6d00}.pill.notfunded{background:#fde2e2;color:var(--error)}
.btn{background:var(--primary);border:2px solid var(--primary);border-radius:6px;color:#fff;cursor:pointer;font:700 14px var(--ui);padding:.45rem 1rem}
.btn.secondary{background:#fff;color:var(--primary)}.btn[disabled]{opacity:.55;cursor:default}
.note{color:var(--muted);font-size:13px}
.msg{font-weight:700;margin:8px 0}.msg.err{color:var(--error)}.msg.ok{color:var(--ok)}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.panel h2{font:700 18px var(--ui);color:var(--primary);margin:0 0 4px}
.doc-frame{width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff}
.links a{margin-right:12px;font-weight:700;color:var(--primary)}
.score{display:flex;gap:6px;margin:4px 0 12px}.score label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.score input{accent-color:var(--primary)}
fieldset{border:0;padding:0;margin:0 0 6px}legend{font-weight:700;font-size:14px}
textarea,select.full{width:100%;border:1px solid var(--border);border-radius:6px;font:400 14px var(--ui);padding:8px 10px;margin:4px 0 12px}
textarea{min-height:110px}
.other{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px}
.card b{display:block;font-size:24px;color:var(--primary)}
.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.reports h3{font-size:15px;margin:0 0 6px}.reports .wide{grid-column:1/-1}.panel{overflow-x:auto}
.bar{height:8px;background:var(--primary-light);border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary)}
.bar.over span{background:var(--error)}
input.cell{width:90px;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font:400 14px var(--ui)}
input.cell.rank{width:56px}input.cell.wide{width:180px}
select.cell{border:1px solid var(--border);border-radius:5px;padding:5px 7px;font:400 14px var(--ui)}
.flag{color:#8a6d00;font-size:12px;display:block}
.coi{background:var(--bg-alt);border-radius:8px;font-size:13px;padding:10px 12px;margin:0 0 12px}.coi ul{margin:4px 0 0;padding-left:18px}
.linkbtn{background:none;border:0;color:var(--primary);cursor:pointer;font:700 14px var(--ui);margin-right:12px;padding:0;text-decoration:underline}
.decide{border-top:2px solid var(--gold);margin-top:16px;padding-top:12px}.decide .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
.decide label{font-size:13px;font-weight:700}.decide input,.decide select{display:block;margin-top:3px}
.assignbar{background:var(--gold-light);border:1px solid var(--gold-dark);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.assignbar label,.pick label{display:inline-flex;gap:6px;align-items:center;margin-right:10px}
.who{font-size:12px;display:block;white-space:nowrap}.who.scored{color:var(--ok)}.who.conflict{color:var(--error)}.who.todo{color:#8a6d00}
.pick{margin:6px 0 10px;line-height:2}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;align-items:start}
.form-grid label{font-weight:700;font-size:14px}.form-grid input,.form-grid select{display:block;width:100%;margin-top:4px;border:1px solid var(--border);border-radius:6px;font:400 14px var(--ui);padding:7px 10px}
.form-grid .note{font-weight:400;display:block}.form-grid input[type=checkbox]{display:inline;width:auto;margin-right:6px}
td .linkbtn{font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
@media print{header nav,.toolbar,.noprint{display:none!important}body{background:#fff}main{padding:0}.card,.panel,table{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>EEG101 grants portal</h1>
  <nav class="tabs" id="tabs"></nav>
  <span class="me" id="me"></span>
</header>
<main id="main"><p class="note">Loading…</p></main>
<script>
const BOOT = <?!= boot ?>;
const me = BOOT.me;
let data = null, view = 'list', openId = null, filter = { scheme: '', q: '', mine: '' }, pending = {}, notice = '';
const main = document.getElementById('main');

function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function money(n) { return n == null || n === '' ? '' : '€' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function fmt(iso) { return /^\d{4}-\d{2}-\d{2}/.test(iso || '') ? new Date(iso.slice(0, 10) + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : ''; }
// Every call carries this reviewer's personal key, which the server checks.
function call(fn, ...args) { return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](BOOT.key, ...args)); }
function download(name, base64) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([Uint8Array.from(atob(base64), c => c.charCodeAt(0))], { type: 'application/pdf' }));
  a.download = name; a.target = '_self'; document.body.appendChild(a); a.click(); a.remove();
}
function fail(err) { main.insertAdjacentHTML('afterbegin', `<p class="msg err">${esc((err && err.message) || err)}</p>`); }

document.getElementById('me').textContent = `${me.name || me.email} · ${me.chair ? 'Chair' : BOOT.blind ? 'Reviewer (blind review)' : 'Reviewer'}`;
const TABS = [['list', 'Applications']].concat(me.chair ? [['decide', 'Ranking and funding'], ['people', 'Reviewers'], ['call', 'Call settings']] : [], me.chair || !BOOT.blind ? [['report', 'Reports']] : []);
let selected = {};
function tabs() { document.getElementById('tabs').innerHTML = TABS.map(t => `<button type="button" data-tab="${t[0]}" class="${view === t[0] || (view === 'detail' && t[0] === 'list') ? 'on' : ''}">${t[1]}</button>`).join(''); }
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); });

async function load() { data = await call('listApplications'); }
async function show(v, id) {
  view = v; openId = id || null; tabs();
  try {
    if (!data || v === 'list' || v === 'decide') await load();
    if (v === 'list') renderList();
    else if (v === 'detail') await renderDetail(id);
    else if (v === 'decide') renderDecide();
    else if (v === 'report') await renderReport();
    else if (v === 'people') await renderPeople();
    else if (v === 'call') await renderCall();
  } catch (err) { main.innerHTML = ''; fail(err); }
}

function statusPill(a) {
  if (a.own) return '<span class="pill coi">Your application</span>';
  if (a.mine && a.mine.conflict) return '<span class="pill coi">Conflict declared</span>';
  if (a.mine) return '<span class="pill ok">Scored</span>';
  return '<span class="pill todo">To score</span>';
}
function decisionPill(d) { return d ? `<span class="pill ${d.toLowerCase().replace(/\s/g, '')}">${esc(d)}</span>` : ''; }

/* -------------------------------------------------------- applications */

function renderList() {
  const apps = data.applications.filter(a => (!filter.scheme || a.scheme === filter.scheme) && (!filter.mine || (filter.mine === 'todo' ? !a.mine && !a.own : filter.mine === 'assigned' ? a.assignedToMe : filter.mine === 'unassigned' ? !a.assigned.length : !!a.mine)) && (!filter.q || (a.id + ' ' + a.applicant + ' ' + a.title + ' ' + a.institution).toLowerCase().indexOf(filter.q.toLowerCase()) >= 0));
  const schemes = Array.from(new Set(data.applications.map(a => a.scheme))).sort();
  const todo = data.applications.filter(a => !a.mine && !a.own).length;
  main.innerHTML = `<div class="toolbar">
    <input id="q" type="search" placeholder="Search name, title, ID…" value="${esc(filter.q)}" aria-label="Search">
    <select id="fs" aria-label="Scheme"><option value="">All schemes</option>${schemes.map(s => `<option${s === filter.scheme ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select id="fm" aria-label="My reviews"><option value="">All applications</option><option value="todo"${filter.mine === 'todo' ? ' selected' : ''}>Still to score</option><option value="done"${filter.mine === 'done' ? ' selected' : ''}>Scored by me</option>${me.chair ? `<option value="unassigned"${filter.mine === 'unassigned' ? ' selected' : ''}>No reviewers assigned</option>` : `<option value="assigned"${filter.mine === 'assigned' ? ' selected' : ''}>Assigned to me</option>`}</select>
    <span class="note">${data.applications.length} applications · ${todo} still to score by you</span></div>
  ${notice ? `<p class="msg ok">${esc(notice)}</p>` : ''}
  ${me.chair ? assignBar() : ''}
  ${apps.length ? `<table><thead><tr>${me.chair ? `<th><input type="checkbox" id="all" aria-label="Select all"${apps.every(a => selected[a.id]) ? ' checked' : ''}></th>` : ''}<th>ID</th><th>Applicant</th><th>Scheme</th><th>Title</th><th>Dates</th><th class="num">Requested</th><th>You</th><th class="num">Reviews</th><th class="num">Mean</th>${me.chair ? '<th>Reviewers</th>' : ''}<th>Decision</th></tr></thead><tbody>
  ${apps.map(a => `<tr class="click" data-id="${esc(a.id)}">${me.chair ? `<td><input type="checkbox" data-sel="${esc(a.id)}" aria-label="Select ${esc(a.id)}"${selected[a.id] ? ' checked' : ''}></td>` : ''}<td>${esc(a.id)}${a.assignedToMe ? '<span class="who todo">Assigned to you</span>' : ''}</td><td>${data.blind ? `<span class="note">Hidden (blind review)</span>` : esc(a.applicant)}<span class="note" style="display:block">${[a.institution, a.country].filter(Boolean).map(esc).join(', ')}</span></td><td>${esc(a.scheme)}</td><td>${esc(a.title)}${a.notes ? `<span class="flag">⚠ ${esc(a.notes)}</span>` : ''}</td><td>${fmt(a.start)} – ${fmt(a.end)}</td><td class="num">${money(a.requested)}</td><td>${statusPill(a)}</td><td class="num">${a.reviewCount}</td><td class="num">${a.mean == null ? '—' : a.mean.toFixed(2)}</td>${me.chair ? `<td>${assignedList(a)}</td>` : ''}<td>${decisionPill(a.decision)}</td></tr>`).join('')}
  </tbody></table>` : '<p class="note">No applications match.</p>'}
  ${me.chair ? '<p class="note">Applications with no reviewers assigned are open to every reviewer. Once you assign reviewers, only they (and the chairs) can see that application. Tick applications to assign them in bulk, or assign from an application\'s own page.</p>' : ''}
  <p class="note">${me.chair ? 'As a chair you see every score straight away, and can score and decide on applications yourself.' : 'Mean scores of other reviewers appear once you have scored an application yourself.'} Nobody sees scores for an application they declared a conflict on, or their own.${data.blind ? ' Review is blind: applicants\' names, contact details, institutions, gender and documents are hidden from you.' : ''}</p>`;
  main.querySelector('#q').addEventListener('input', e => { filter.q = e.target.value; renderListKeepFocus(); });
  main.querySelector('#fs').addEventListener('change', e => { filter.scheme = e.target.value; renderList(); });
  main.querySelector('#fm').addEventListener('change', e => { filter.mine = e.target.value; renderList(); });
  main.querySelectorAll('tr[data-id]').forEach(r => r.addEventListener('click', e => { if (e.target.closest('input')) return; show('detail', r.dataset.id); }));
  main.querySelectorAll('[data-sel]').forEach(c => c.addEventListener('change', () => { if (c.checked) selected[c.dataset.sel] = true; else delete selected[c.dataset.sel]; renderList(); }));
  const all = main.querySelector('#all');
  if (all) all.addEventListener('change', () => { apps.forEach(a => { if (all.checked) selected[a.id] = true; else delete selected[a.id]; }); renderList(); });
  bindAssignBar();
}

function assignedList(a) {
  if (!a.assigned.length) return '<span class="note">Open to all</span>';
  return a.assigned.map(x => `<span class="who ${x.status}">${x.status === 'scored' ? '✓' : x.status === 'conflict' ? '✕' : '○'} ${esc(x.name)}</span>`).join('');
}

function assignBar() {
  const ids = Object.keys(selected).filter(id => data.applications.some(a => a.id === id));
  if (!ids.length) return '';
  return `<div class="assignbar"><b>${ids.length} selected</b>
    <span class="pick">${data.reviewers.map(r => `<label><input type="checkbox" name="pick" value="${esc(r.email)}"> ${esc(r.name || r.email)}${r.chair ? ' (chair)' : ''}</label>`).join('')}</span>
    <label><input type="checkbox" id="notify" checked> Email them</label>
    <button type="button" class="btn" id="assignAdd">Assign</button><button type="button" class="btn secondary" id="assignRemove">Unassign</button>
    <button type="button" class="linkbtn" id="assignClear">Clear selection</button><span id="amsg" class="msg"></span></div>`;
}

function bindAssignBar() {
  const add = main.querySelector('#assignAdd');
  if (!add) return;
  const run = async remove => {
    const picks = Array.from(main.querySelectorAll('[name=pick]:checked')).map(x => x.value);
    const msg = main.querySelector('#amsg');
    if (!picks.length) { msg.className = 'msg err'; msg.textContent = 'Tick at least one reviewer.'; return; }
    try {
      msg.className = 'msg'; msg.textContent = 'Saving…';
      data = await call('assignReviewers', { ids: Object.keys(selected), add: remove ? [] : picks, remove: remove ? picks : [], notify: !remove && main.querySelector('#notify').checked });
      notice = data.notice; selected = {}; renderList(); notice = '';
    } catch (err) { msg.className = 'msg err'; msg.textContent = (err && err.message) || 'Could not save.'; }
  };
  add.addEventListener('click', () => run(false));
  main.querySelector('#assignRemove').addEventListener('click', () => run(true));
  main.querySelector('#assignClear').addEventListener('click', () => { selected = {}; renderList(); });
}
function renderListKeepFocus() { const pos = main.querySelector('#q').selectionStart; renderList(); const q = main.querySelector('#q'); q.focus(); q.setSelectionRange(pos, pos); }

/* -------------------------------------------------------------- detail */

async function renderDetail(id) {
  const a = data.applications.filter(x => x.id === id)[0];
  main.innerHTML = '<p class="note">Loading the application…</p>';
  const full = await call('getApplication', id);
  const mine = a.mine || {};
  const docs = full.blind ? '' : `<button type="button" class="linkbtn" data-doc="application">Application PDF</button>${Object.keys(full.documents || {}).map(k => `<button type="button" class="linkbtn" data-doc="${esc(k)}">${esc(full.documents[k].label.split(' (')[0].split(',')[0].replace(/^Your /, ''))}</button>`).join('')}${me.chair && full.folder ? `<a href="${esc(full.folder)}">Drive folder</a>` : ''}`;
  const coi = `<div class="coi"><b>Declare a conflict of interest if:</b><ul>${BOOT.conflictGuidance.map(g => `<li>${esc(g)}</li>`).join('')}</ul>If in doubt, declare it. You will then not score this application or see its other reviews${me.chair ? ', and another chair must decide on it' : ''}.</div>`;
  const reviewForm = a.own
    ? '<p class="msg">This is your own application, so you cannot review it, see its scores or decide on it.</p>'
    : `<form id="rev">
      ${coi}
      <label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0 14px"><input type="checkbox" name="conflict"${mine.conflict ? ' checked' : ''}> <span>I have a conflict of interest with this application and will not score it.</span></label>
      <div id="scoring"${mine.conflict ? ' hidden' : ''}>
      ${BOOT.criteria.map((c, i) => `<fieldset><legend>${esc(c.label)}</legend><div class="score">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="s${i}" value="${n}"${mine.scores && mine.scores[i] === n ? ' checked' : ''}>${n}</label>`).join('')}</div></fieldset>`).join('')}
      <p class="note">1 poor · 2 weak · 3 good · 4 very good · 5 excellent</p>
      <label><b>Recommendation</b><select class="full" name="recommendation"><option value="">Select…</option>${BOOT.recommendations.map(r => `<option${mine.recommendation === r ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select></label>
      <label><b>Comments</b> <span class="note">(seen by the other reviewers and chairs, not by the applicant)</span><textarea name="comments">${esc(mine.comments || '')}</textarea></label>
      </div>
      <button class="btn" type="submit">Save review</button> <span id="saved" class="msg"></span>
    </form>`;
  const decide = me.chair && !a.conflicted ? `<form id="dec" class="decide"><b>Decision</b>
      <div class="row"><label>Decision<select class="cell" name="decision">${BOOT.decisions.map(d => `<option value="${esc(d)}"${a.decision === d ? ' selected' : ''}>${d || '—'}</option>`).join('')}</select></label>
      <label>Awarded (€)<input class="cell" name="awarded" type="number" min="0" step="0.01" max="${a.requested}" placeholder="${a.requested}" value="${a.awarded == null ? '' : a.awarded}"></label>
      <label>Rank<input class="cell rank" name="rank" type="number" min="1" value="${a.rank == null ? '' : a.rank}"></label></div>
      <label>Notes<input class="cell wide" style="width:100%" name="notes" value="${esc(a.decisionNotes)}"></label>
      <p class="note">Leave the amount empty to award what was requested.</p>
      <button class="btn" type="submit">Save decision</button> <span id="dsaved" class="msg"></span></form>`
    : me.chair ? '<p class="note decide">You declared a conflict of interest or applied yourself, so another chair must decide on this application.</p>' : '';
  const assign = me.chair ? `<form id="asg" class="decide"><b>Reviewers for this application</b>
      <p class="note">${a.assigned.length ? 'Only these reviewers (and the chairs) can see it.' : 'None assigned: every reviewer can see it.'}</p>
      <div class="pick">${data.reviewers.map(r => { const x = a.assigned.filter(y => y.email === r.email)[0]; return `<label><input type="checkbox" name="pick" value="${esc(r.email)}"${x ? ' checked' : ''}> ${esc(r.name || r.email)}${r.chair ? ' (chair)' : ''}${x ? ` <span class="who ${x.status}" style="display:inline">${x.status === 'scored' ? 'scored' : x.status === 'conflict' ? 'conflict' : 'to score'}</span>` : ''}</label>`; }).join('<br>')}</div>
      <label style="font-size:13px"><input type="checkbox" name="notify" checked> Email newly assigned reviewers</label><br>
      <button class="btn secondary" type="submit">Save reviewers</button> <span id="asaved" class="msg"></span></form>` : '';
  main.innerHTML = `<p class="noprint"><button type="button" class="btn secondary" id="back">← All applications</button></p>
  <div class="layout"><div>
    <div class="panel" style="margin-bottom:14px"><h2>${esc(a.id)} · ${esc(a.title)}</h2>
      <p class="note">${a.applicant ? esc(a.applicant) + ' · ' : ''}${esc(a.scheme)} · ${money(a.requested)} · ${fmt(a.start)} – ${fmt(a.end)} (${a.days} days) · ${a.itc === 'Yes' ? 'ITC · ' : ''}${a.yri === 'Yes' ? 'Under 40 · ' : ''}${esc(a.career)}${a.mean != null ? ` · mean score ${a.mean.toFixed(2)} from ${a.reviewCount}` : ''}${a.decision ? ` · ${esc(a.decision)}` : ''}</p>
      ${a.notes ? `<p class="flag">⚠ ${esc(a.notes)}</p>` : ''}
      ${docs ? `<p class="links">${docs}</p><span id="docmsg" class="msg"></span>` : '<p class="note">Shown without the applicant\'s identity or documents, for blind review.</p>'}</div>
    <iframe class="doc-frame" sandbox title="Application" srcdoc="${esc(full.html)}"></iframe>
  </div><div class="panel"><h2>Your review</h2>
    ${reviewForm}
    ${decide}
    ${assign}
    ${a.others.length ? `<div class="other"><b>Other reviews</b>${a.others.map(o => `<p>${esc(o.reviewer)}: ${o.conflict ? 'conflict declared' : `mean ${o.mean == null ? '—' : o.mean.toFixed(2)} (${o.scores.join(' / ')}), ${esc(o.recommendation)}`}${o.comments ? `<br><span class="note">${esc(o.comments)}</span>` : ''}</p>`).join('')}</div>` : ''}
  </div></div>`;
  main.querySelector('#back').addEventListener('click', () => show('list'));
  main.querySelectorAll('[data-doc]').forEach(b => b.addEventListener('click', async () => {
    const msg = main.querySelector('#docmsg');
    try { msg.className = 'msg'; msg.textContent = 'Downloading…'; const d = await call('getDocument', a.id, b.dataset.doc); download(d.name, d.data); msg.textContent = ''; }
    catch (err) { msg.className = 'msg err'; msg.textContent = (err && err.message) || 'Could not download.'; }
  }));
  const form = main.querySelector('#rev');
  if (form) {
    form.conflict.addEventListener('change', () => { main.querySelector('#scoring').hidden = form.conflict.checked; });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const out = main.querySelector('#saved');
      const scores = BOOT.criteria.map((c, i) => { const r = form.querySelector(`[name=s${i}]:checked`); return r ? Number(r.value) : null; });
      try {
        out.className = 'msg'; out.textContent = 'Saving…';
        data = await call('saveReview', { id: a.id, conflict: form.conflict.checked, scores: scores, recommendation: form.recommendation.value, comments: form.comments.value });
        out.className = 'msg ok'; out.textContent = 'Saved.';
        setTimeout(() => show('detail', a.id), 600);
      } catch (err) { out.className = 'msg err'; out.textContent = (err && err.message) || 'Could not save.'; }
    });
  }
  const asg = main.querySelector('#asg');
  if (asg) asg.addEventListener('submit', async e => {
    e.preventDefault();
    const out = main.querySelector('#asaved');
    const boxes = Array.from(asg.querySelectorAll('[name=pick]'));
    try {
      out.className = 'msg'; out.textContent = 'Saving…';
      data = await call('assignReviewers', { ids: [a.id], add: boxes.filter(b => b.checked).map(b => b.value), remove: boxes.filter(b => !b.checked).map(b => b.value), notify: asg.notify.checked });
      out.className = 'msg ok'; out.textContent = data.notice || 'Saved.';
      setTimeout(() => show('detail', a.id), 1200);
    } catch (err) { out.className = 'msg err'; out.textContent = (err && err.message) || 'Could not save.'; }
  });
  const dec = main.querySelector('#dec');
  if (dec) dec.addEventListener('submit', async e => {
    e.preventDefault();
    const out = main.querySelector('#dsaved');
    try {
      out.className = 'msg'; out.textContent = 'Saving…';
      data = await call('saveDecisions', [{ id: a.id, decision: dec.decision.value, awarded: dec.awarded.value, rank: dec.rank.value, notes: dec.notes.value }]);
      out.className = 'msg ok'; out.textContent = 'Saved.';
      setTimeout(() => show('detail', a.id), 600);
    } catch (err) { out.className = 'msg err'; out.textContent = (err && err.message) || 'Could not save.'; }
  });
}

/* ------------------------------------------------------ ranking (chair) */

function renderDecide() {
  const budgets = {};
  Object.keys(BOOT.schemes).forEach(id => { const v = Number(data.settings['budget_' + id]); budgets[BOOT.schemes[id].short] = v > 0 ? v : null; });
  const groups = {};
  data.applications.forEach(a => { (groups[a.scheme] = groups[a.scheme] || []).push(a); });
  const sorted = list => list.slice().sort((x, y) => (x.rank || 1e9) - (y.rank || 1e9) || (y.mean || 0) - (x.mean || 0));
  const value = (a, k) => pending[a.id] && pending[a.id][k] !== undefined ? pending[a.id][k] : (k === 'decision' ? a.decision : k === 'awarded' ? (a.awarded == null ? '' : a.awarded) : k === 'rank' ? (a.rank == null ? '' : a.rank) : a.decisionNotes);
  const committed = list => list.reduce((s, a) => s + (value(a, 'decision') === 'Funded' ? Number(value(a, 'awarded') === '' ? a.requested : value(a, 'awarded')) || 0 : 0), 0);
  main.innerHTML = `<div class="toolbar"><button type="button" class="btn secondary" id="autorank">Rank each scheme by mean score</button>
    <button type="button" class="btn" id="save" ${Object.keys(pending).length ? '' : 'disabled'}>Save ${Object.keys(pending).length || ''} change${Object.keys(pending).length === 1 ? '' : 's'}</button>
    <span class="note">Choose "Funded" to select an application; leave the amount empty to award what was requested. The money available per scheme is set in the Settings tab of the spreadsheet.</span><span id="dmsg" class="msg"></span></div>
  ${Object.keys(groups).sort().map(g => { const list = sorted(groups[g]); const used = committed(list); const b = budgets[g]; return `<div class="panel" style="margin-bottom:16px"><h2>${esc(g)}</h2>
    <p class="note">${list.length} application${list.length === 1 ? '' : 's'} · committed ${money(used)}${b ? ` of ${money(b)} (${money(b - used)} left)` : ''}</p>
    ${b ? `<div class="bar${used > b ? ' over' : ''}"><span style="width:${Math.min(100, used / b * 100)}%"></span></div>` : ''}
    <table style="margin-top:10px"><thead><tr><th>Rank</th><th>ID</th><th>Applicant</th><th>Title</th><th class="num">Mean</th><th class="num">Reviews</th><th class="num">Requested</th><th>Decision</th><th>Awarded (€)</th><th>Notes</th></tr></thead><tbody>
    ${list.map(a => { const off = a.conflicted ? ' disabled title="You declared a conflict of interest or applied yourself: another chair must decide."' : ''; return `<tr><td><input class="cell rank" data-id="${esc(a.id)}" data-k="rank" type="number" min="1" value="${esc(value(a, 'rank'))}" aria-label="Rank"${off}></td><td><a href="#" data-open="${esc(a.id)}" target="_self">${esc(a.id)}</a></td><td>${esc(a.applicant)}</td><td>${esc(a.title)}${a.notes ? `<span class="flag">⚠ ${esc(a.notes)}</span>` : ''}${a.conflicted ? '<span class="flag">You cannot decide on this one (conflict or own application).</span>' : ''}</td>
    <td class="num">${a.mean == null ? '—' : a.mean.toFixed(2)}</td><td class="num">${a.reviewCount}</td><td class="num">${money(a.requested)}</td>
    <td><select class="cell" data-id="${esc(a.id)}" data-k="decision" aria-label="Decision"${off}>${BOOT.decisions.map(d => `<option value="${esc(d)}"${value(a, 'decision') === d ? ' selected' : ''}>${d || '—'}</option>`).join('')}</select></td>
    <td><input class="cell" data-id="${esc(a.id)}" data-k="awarded" type="number" min="0" step="0.01" max="${a.requested}" placeholder="${a.requested}" value="${esc(value(a, 'awarded'))}" aria-label="Awarded"${off}></td>
    <td><input class="cell wide" data-id="${esc(a.id)}" data-k="notes" value="${esc(value(a, 'notes'))}" aria-label="Notes"${off}></td></tr>`; }).join('')}
    </tbody></table></div>`; }).join('') || '<p class="note">No applications yet.</p>'}`;
  main.querySelectorAll('[data-k]').forEach(el => el.addEventListener('change', () => {
    const a = data.applications.filter(x => x.id === el.dataset.id)[0];
    pending[a.id] = pending[a.id] || {};
    pending[a.id][el.dataset.k] = el.value;
    renderDecide();
  }));
  main.querySelectorAll('[data-open]').forEach(l => l.addEventListener('click', e => { e.preventDefault(); show('detail', l.dataset.open); }));
  main.querySelector('#autorank').addEventListener('click', () => {
    Object.keys(groups).forEach(g => groups[g].slice().sort((x, y) => (y.mean || 0) - (x.mean || 0)).forEach((a, i) => { if (a.conflicted) return; pending[a.id] = pending[a.id] || {}; pending[a.id].rank = String(i + 1); }));
    renderDecide();
  });
  main.querySelector('#save').addEventListener('click', async () => {
    const changes = Object.keys(pending).map(id => { const a = data.applications.filter(x => x.id === id)[0]; return { id: id, decision: value(a, 'decision'), awarded: value(a, 'awarded'), rank: value(a, 'rank'), notes: value(a, 'notes') }; });
    const msg = main.querySelector('#dmsg');
    try { msg.className = 'msg'; msg.textContent = 'Saving…'; data = await call('saveDecisions', changes); pending = {}; renderDecide(); main.querySelector('#dmsg').className = 'msg ok'; main.querySelector('#dmsg').textContent = 'Saved.'; }
    catch (err) { msg.className = 'msg err'; msg.textContent = (err && err.message) || 'Could not save.'; }
  });
}

/* ----------------------------------------------------- reviewers (chair) */

async function renderPeople(list, message) {
  if (!list) { main.innerHTML = '<p class="note">Loading…</p>'; list = await call('listReviewers'); }
  main.innerHTML = `<div class="panel" style="margin-bottom:16px"><h2>Add a reviewer or chair</h2>
    <form id="add" class="form-grid" style="margin-top:10px">
      <label>Name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Role<select name="role"><option value="reviewer">Reviewer</option><option value="chair">Chair</option></select></label>
      <label style="align-self:end"><input type="checkbox" name="invite" checked> Email them their link now</label>
      <div style="align-self:end"><button class="btn" type="submit">Add</button></div>
    </form><p class="note">Reviewers score the applications open or assigned to them${BOOT.blind ? ', without seeing who applied (blind review)' : ''}. Chairs see everything, score, assign reviewers, decide on funding and manage this list. Everyone gets a personal link by email; no password or Google account is needed.</p></div>
  ${message ? `<p class="msg ok">${esc(message)}</p>` : ''}<span id="pmsg" class="msg"></span>
  <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Invited</th><th class="num">Assigned</th><th class="num">Scored</th><th class="num">Conflicts</th><th></th></tr></thead><tbody>
  ${list.map(p => `<tr><td>${esc(p.name)}${p.self ? ' <span class="note">(you)</span>' : ''}</td><td>${esc(p.email)}</td>
    <td>${p.self ? 'Chair' : `<select class="cell" data-role="${esc(p.email)}" aria-label="Role"><option value="reviewer"${p.chair ? '' : ' selected'}>Reviewer</option><option value="chair"${p.chair ? ' selected' : ''}>Chair</option></select>`}</td>
    <td>${p.invited ? esc(p.invited) : '<span class="note">Not yet</span>'}</td><td class="num">${p.assigned ? `${p.assignedDone} of ${p.assigned} done` : '—'}</td><td class="num">${p.scored}</td><td class="num">${p.conflicts}</td>
    <td><button type="button" class="linkbtn" data-invite="${esc(p.email)}">${p.invited ? 'Resend link' : 'Send link'}</button><button type="button" class="linkbtn" data-renew="${esc(p.email)}">New link</button>${p.self ? '' : `<button type="button" class="linkbtn" data-remove="${esc(p.email)}">Remove</button>`}</td></tr>`).join('')}
  </tbody></table>
  <p class="note">"New link" emails a fresh link and stops the old one working, for example if a link was forwarded by mistake. "Remove" stops their link at once and takes them off their assignments; their reviews so far are kept.</p>`;
  const msg = main.querySelector('#pmsg');
  const act = async (fn, args, done) => {
    try { msg.className = 'msg'; msg.textContent = 'Saving…'; const l = await call(fn, ...args); data = null; renderPeople(l, done); }
    catch (err) { msg.className = 'msg err'; msg.textContent = (err && err.message) || 'Could not save.'; }
  };
  const form = main.querySelector('#add');
  form.addEventListener('submit', e => { e.preventDefault(); act('saveReviewer', [{ name: form.name.value, email: form.email.value, role: form.role.value, invite: form.invite.checked }], `${form.name.value || form.email.value} added${form.invite.checked ? ' and emailed their link' : ''}.`); });
  main.querySelectorAll('[data-role]').forEach(sel => sel.addEventListener('change', () => act('saveReviewer', [{ email: sel.dataset.role, role: sel.value }], 'Role changed.')));
  main.querySelectorAll('[data-invite]').forEach(b => b.addEventListener('click', () => act('inviteReviewer', [b.dataset.invite, false], `Link sent to ${b.dataset.invite}.`)));
  main.querySelectorAll('[data-renew]').forEach(b => b.addEventListener('click', () => { if (confirm(`Send ${b.dataset.renew} a new link? Their old link will stop working.`)) act('inviteReviewer', [b.dataset.renew, true], `New link sent to ${b.dataset.renew}.`); }));
  main.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { if (confirm(`Remove ${b.dataset.remove}? Their link will stop working.`)) act('removeReviewer', [b.dataset.remove], `${b.dataset.remove} removed.`); }));
}

/* ------------------------------------------------- call settings (chair) */

async function renderCall(state, message) {
  if (!state) { main.innerHTML = '<p class="note">Loading…</p>'; state = await call('getCallSettings'); }
  const v = state.values;
  const input = f => f.type === 'bool'
    ? `<label><input type="checkbox" name="${f.key}"${v[f.key] ? ' checked' : ''}> ${esc(f.label)}<span class="note">${esc(f.help)}</span></label>`
    : `<label>${esc(f.label)}<input name="${f.key}" type="${f.type === 'datetime' ? 'datetime-local' : f.type === 'date' ? 'date' : f.type === 'money' ? 'number' : 'text'}"${f.type === 'money' ? ' min="0" step="1"' : ''} value="${esc(v[f.key])}"><span class="note">${esc(f.help)}</span></label>`;
  main.innerHTML = `<div class="panel"><h2>Call settings</h2>
    <p class="note">The application form is <b>${state.open ? 'open' : 'closed'}</b> right now.${state.formUrl ? ` Reviewers' links point to ${esc(state.formUrl)}.` : ''}</p>
    ${message ? `<p class="msg ok">${esc(message)}</p>` : ''}
    <form id="callform"><h3>The call</h3><div class="form-grid">${state.fields.filter(f => !/^budget_/.test(f.key)).map(input).join('')}</div>
    <h3 style="margin-top:18px">Money available per scheme</h3><div class="form-grid">${state.fields.filter(f => /^budget_/.test(f.key)).map(input).join('')}</div>
    <p style="margin-top:16px"><button class="btn" type="submit">Save settings</button> <span id="cmsg" class="msg"></span></p></form>
    <p class="note">For a new call: change the ID prefix (e.g. G3), the name, the deadline and the end date, then switch "Accepting applications" on. Earlier applications are kept. On the website, also set each open scheme to "open" so the Apply button shows.</p></div>`;
  const form = main.querySelector('#callform');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const out = {};
    state.fields.forEach(f => { const el = form.elements[f.key]; out[f.key] = f.type === 'bool' ? el.checked : el.value; });
    const msg = main.querySelector('#cmsg');
    try { msg.className = 'msg'; msg.textContent = 'Saving…'; const s2 = await call('saveCallSettings', out); data = null; renderCall(s2, 'Saved.'); }
    catch (err) { msg.className = 'msg err'; msg.textContent = (err && err.message) || 'Could not save.'; }
  });
}

/* ------------------------------------------------------------- reports */

function table(title, submitted, funded, opts) {
  opts = opts || {};
  const keys = Array.from(new Set((submitted || []).map(x => x.key).concat((funded || []).map(x => x.key)))).sort();
  const get = (list, k) => (list || []).filter(x => x.key === k)[0] || { count: 0, amount: 0 };
  const label = k => opts.months && /^\d{4}-\d{2}$/.test(k) ? new Date(k + '-15T12:00:00Z').toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }) : k;
  return `<div class="panel${opts.wide ? ' wide' : ''}"><h3>${esc(title)}</h3><table><thead><tr><th></th>${submitted ? `<th class="num">Applied</th>${opts.requested ? '<th class="num">Requested</th>' : ''}` : ''}<th class="num">Funded</th><th class="num">Awarded</th>${opts.budget ? '<th class="num">Budget</th><th class="num">Left</th>' : ''}</tr></thead><tbody>
  ${keys.map(k => { const s = get(submitted, k), f = get(funded, k), b = opts.budget ? opts.budget[k] : null; return `<tr><td>${esc(label(k))}</td>${submitted ? `<td class="num">${s.count}</td>${opts.requested ? `<td class="num">${money(s.amount)}</td>` : ''}` : ''}<td class="num">${f.count}</td><td class="num">${money(f.amount)}</td>${opts.budget ? `<td class="num">${b ? money(b) : '—'}</td><td class="num">${b ? money(b - f.amount) : '—'}</td>` : ''}</tr>`; }).join('') || '<tr><td colspan="6" class="note">Nothing yet.</td></tr>'}
  </tbody></table></div>`;
}

let lastReport = null;
async function renderReport() {
  main.innerHTML = '<p class="note">Building the report…</p>';
  const r = lastReport = await call('getReport');
  main.innerHTML = `<div class="toolbar"><button class="btn secondary" type="button" id="csv">Download funded list (CSV)</button><button class="btn secondary" type="button" id="print">Print or save as PDF</button><span class="note">${esc(r.callName)} · generated ${esc(r.generated)}</span></div>
  <div class="cards"><div class="card"><b>${r.totals.submitted}</b>applications</div><div class="card"><b>${money(r.totals.requested)}</b>requested</div><div class="card"><b>${r.totals.funded}</b>funded</div><div class="card"><b>${money(r.totals.awarded)}</b>awarded</div></div>
  <div class="reports">
    ${table('By scheme', r.byScheme.submitted, r.byScheme.funded, { requested: true, budget: r.byScheme.budget, wide: true })}
    ${table('Funded by start month', null, r.byMonth, { months: true })}
    ${table('Gender', r.byGender.submitted, r.byGender.funded)}
    ${table('Inclusiveness Target Countries', r.byItc.submitted, r.byItc.funded)}
    ${table('Young Researchers and Innovators (under 40)', r.byYri.submitted, r.byYri.funded)}
    ${table('Career stage', r.byCareer.submitted, r.byCareer.funded)}
    ${table('Country of institution', r.byCountry.submitted, r.byCountry.funded)}
  </div>
  <div class="panel" style="margin-top:18px"><h3>Funded applications</h3><table><thead><tr><th>ID</th><th>Applicant</th><th>Scheme</th><th>Title</th><th>Country</th><th>Dates</th><th class="num">Awarded</th></tr></thead><tbody>
  ${r.fundedList.map(f => `<tr><td>${esc(f.id)}</td><td>${esc(f.applicant)}</td><td>${esc(f.scheme)}</td><td>${esc(f.title)}</td><td>${esc(f.country)}</td><td>${fmt(f.start)} – ${fmt(f.end)}</td><td class="num">${money(f.awarded)}</td></tr>`).join('') || '<tr><td colspan="7" class="note">Nothing funded yet.</td></tr>'}
  </tbody></table></div>`;
  main.querySelector('#print').addEventListener('click', () => window.print());
  main.querySelector('#csv').addEventListener('click', () => {
    const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const rows = [['ID', 'Applicant', 'Scheme', 'Title', 'Country', 'Start', 'End', 'Awarded (EUR)']].concat(r.fundedList.map(f => [f.id, f.applicant, f.scheme, f.title, f.country, f.start, f.end, f.awarded]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(x => x.map(cell).join(',')).join('\r\n')], { type: 'text/csv' }));
    a.download = 'eeg101-funded-grants.csv'; a.target = '_self'; document.body.appendChild(a); a.click(); a.remove();
  });
}

show('list');
</script>
