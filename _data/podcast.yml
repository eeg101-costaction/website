- id: 3bHjB-facPE
  title: "Online Interview with Inga Griškova-Bulanova"
  alt: "Still from the online interview with Inga Griškova-Bulanova"
  blurb: "Inga Griškova-Bulanova is a Research Professor in the Department of Neurobiology and Biophysics at Vilnius University's Institute of Biosciences, Lithuania. Her research group studies how a person's traits and states, the task at hand and brain stimulation shape the brain's electrical activity measured with EEG, including in disorders of consciousness and schizophrenia. She is a member of EEG101 Working Groups 1, 2 and 3."

