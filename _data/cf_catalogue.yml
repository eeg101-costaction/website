  - id: "W7B483EA"
    title: "ARTEM-IS for ERP: Agreed Reporting Template for EEG Methodology—International Standard for Event-Related Potential Experiments"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Anđela Šoškić, Vanja Ković, Johannes Algermissen, Nastassja L. Fischer, Giorgio Ganis, Remi Gau, Faisal Mushtaq, Guiomar Niso, Robert Oostenveld, Dejan Pajić, Yuri G. Pavlov, Katarina Stekić, Yu-Fang Yang, Suzy J. Styles"
    year: "2025"
    language: "English"
    publication: "Psychophysiology"
    url: "https://onlinelibrary.wiley.com/doi/abs/10.1111/psyp.70187"
    extra_url: "https://onlinelibrary.wiley.com/doi/pdf/10.1111/psyp.70187"
    doi: "10.1111/psyp.70187"
    abstract: "The choices we make during the recording, preprocessing and analysis of event-related potentials (ERP) data can affect study outcomes. As such, it is critical that they are transparently reported to allow for reproducibility. Yet, systematic reviews of reporting practices in the field have shown that journal articles often do not meet this goal and that existing reporting guidelines have not resulted in a sufficient improvement in reporting transparency. An easier workflow for transparently documenting pipelines used in regular journal articles is needed. The ARTEM-IS (Agreed Reporting Template for EEG Methodology—International Standard) initiative is working towards addressing this issue by building dynamic, interactive web applications that support documenting information required by existing publication guidelines in the form of a standardized metadata template. Completing an ARTEM-IS form results in a human-reader-friendly PDF or DOCX and a machine-readable JSON summary of methodological information. This level of specificity surpasses conventional article methods sections, ensuring fewer omissions and ambiguities. These can be used as supplements to a publication, as a memory aid when writing a paper, or as records that allow easier metadata extraction. Here, we present the ARTEM-IS for ERP, which supports describing a typical ERP study, including most of its core methodological aspects (study description, experimental design, hardware, data acquisition, pre-processing, measurement, visualization, additional comments). We discuss the current functionalities of ARTEM-IS for ERP, its development via a grassroots collaborative initiative, and potential extensions (e.g., including complex designs or statistical analyses). In doing so, we highlight how widespread adoption of ARTEM-IS can benefit researchers, reviewers, and the broader scientific community by improving transparency, reducing reporting errors, and expediting rigorous replication efforts."
