    language: "English"
    publication: "Diversity in Academia"
    url: "https://diversityinacademia.mystrikingly.com/"
    extra_url: ""
    doi: ""
    abstract: "The attrition of minorities in academic careers is a major concern, particularly in Science, Technology, Engineering, and Mathematics subjects. For example, across all academic subjects in Europe women account for 59% of undergraduate degrees, but their share declines with every step up the career ladder. Given the many documented benefits of diversity, this is an issue that we should all be concerned about. As we were writing our paper on gender imbalances in question-asking at seminars, we discovered and were pointed to a lot of information on the experiences of minorities in academia. This website is our attempt at bringing it all together. We have pulled together some resources specifically about academic seminars (e.g., how to ask questions, how to chair them). We have also started a database listing scientific studies and media reports on the more general topic of diversity in academia."
