  - id: "YNY3IUBL"
    title: "Using ChatGPT to Improve the Presentation of Plain Language Summaries of Cochrane Systematic Reviews About Oncology Interventions: Cross-Sectional Study"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Jelena Šuto Pavičić, Ana Marušić, Ivan Buljan"
    year: "2025"
    language: "English"
    publication: "JMIR Cancer"
    url: "https://cancer.jmir.org/2025/1/e63347"
    extra_url: ""
    doi: "10.2196/63347"
    abstract: "Background: Plain language summaries (PLSs) of Cochrane systematic reviews are a simple format for presenting medical information to the lay public. This is particularly important in oncology, where patients have a more active role in decision making. However, current PLS formats often exceed the readability requirements for the general population. Cost-effective, more automated solutions to this problem are still lacking. Objective: This study assessed whether a large language model (e.g. Chat Generative Pre-trained Transformer (ChatGPT)) can improve the readability and linguistic characteristics of Cochrane PLSs about oncology interventions, without changing evidence synthesis conclusions. Methods: The dataset included 275 scientific abstracts and corresponding PLSs of Cochrane systematic reviews about oncology interventions, ChatGPT-4 was tasked to make each scientific abstract into a PLS using three prompts: 1) rewrite this scientific abstract into a PLS to achieve a Simple Measure of Gobbledygook (SMOG) index of 6; followed by 2) rewrite the PLS from prompt 1 so it is more emotional; and 3) rewrite this scientific abstract so it is easier to read and more appropriate for the lay audience. ChatGPT-generated PLSs were analyzed for word count, level of readability (SMOG index), and linguistic characteristics using Language Inquiry and Word Count (LIWC) software, and compared to the original PLSs. Two independent assessors reviewed the conclusiveness categories of ChatGPT-generated PLSs and compared them with original abstracts to evaluate consistency. Conclusion of each abstract about efficacy and safety of the intervention was categorized as conclusive (positive/negative/equal), inconclusive or unclear. Group comparisons were conducted using the Friedman nonparametric test. Results: ChatGPT-generated PLSs using the first prompt (SMOG index 6) were the shortest and easiest to read, with a median SMOG score of 8.2 (95% confidence interval (CI): 8–8.4), compared to the original PLSs (median SMOG score 13.1, 95% CI: 12.9–13.4). These PLSs had a median word count of 240 (95% CI: 232- 248) compared to the original PLSs’ median word count of 364 (95% CI: 339-388). The second prompt (emotional tone) generated PLSs with a median SMOG score of 11.4 (95% CI: 11.1–12), again lower than the original PLSs. PLSs produced with the third prompt (write simpler and easier) had a median SMOG score of 8.7 (95% CI: 8.4–8.8). ChatGPT-generated PLSs across all prompts demonstrated reduced analytical tone and increased authenticity, clout, and emotional tone compared to the original PLSs. Importantly, the conclusiveness categorization of the original abstracts was unchanged in the ChatGPT-generated PLSs. Conclusions: ChatGPT can be a valuable tool in simplifying PLSs as medically related formats for lay audiences. More research is needed, including about oversight mechanisms to ensure that the information is accurate, reliable and culturally relevant for different audiences."
