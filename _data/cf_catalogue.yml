    title: "Hacking the brain: brain–computer interfacing technology and the ethics of neurosecurity"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Marcello Ienca, Pim Haselager"
    year: "2016"
    language: "English"
    publication: "Ethics and Information Technology"
    url: "http://link.springer.com/10.1007/s10676-016-9398-9"
    extra_url: ""
    doi: "10.1007/s10676-016-9398-9"
    abstract: "Brain–computer interfacing technologies are used as assistive technologies for patients as well as healthy subjects to control devices solely by brain activity. Yet the risks associated with the misuse of these technologies remain largely unexplored. Recent ﬁndings have shown that BCIs are potentially vulnerable to cybercriminality. This opens the prospect of ‘‘neurocrime’’: extending the range of computer-crime to neural devices. This paper explores a type of neurocrime that we call brain-hacking as it aims at the illicit access to and manipulation of neural information and computation. As neural computation underlies cognition, behavior and our self-determination as persons, a careful analysis of the emerging risks of malicious brain-hacking is paramount, and ethical safeguards against these risks should be considered early in design and regulation. This contribution is aimed at raising awareness of the emerging risk of malicious brain-hacking and takes a ﬁrst step in developing an ethical and legal reﬂection on those risks."
