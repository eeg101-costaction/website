  - id: "SIV4L2FU"
    title: "Mind-Reading or Misleading? Assessing Direct-to-Consumer Electroencephalography (EEG) Devices Marketed for Wellness and Their Ethical and Regulatory Implications"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Anna Wexler, Robert Thibault"
    year: "2019"
    language: "English"
    publication: "Journal of Cognitive Enhancement"
    url: "https://doi.org/10.1007/s41465-018-0091-2"
    extra_url: ""
    doi: "10.1007/s41465-018-0091-2"
    abstract: "The market for direct-to-consumer brain health products—including brain-training games, neurostimulation devices, and consumer electroencephalography (EEG) devices—is expected to top $3 billion by 2020. While many direct-to-consumer neurotechnology products have come under scrutiny from scientists and regulators, one set of products—consumer EEG devices—have largely escaped scholarly and regulatory critique. While these products do not present overt safety risks, by claiming to provide individuals with “snapshots” of their own mental states, they present a subtle, and arguably more complex, set of ethical issues. In addition, consumer EEG companies often explicitly or implicitly rely on studies conducted in the field of neurofeedback, a domain in which almost all adequately controlled studies point to little more than an interesting placebo effect. This paper presents an initial critique of consumer EEG devices, focusing only on devices that are marketed directly to consumers for improving their well-being. We categorize the behavioral and wellness-related marketing claims made by consumer EEG companies, analyze the evidence base for such claims, and argue that the ethical and legal issues wrought by these devices deserve greater attention."
