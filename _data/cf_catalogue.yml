  - id: "ZV5CK99Y"
    title: "FAIR Data Maturity Model. Specification and Guidelines"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "FAIR Data Maturity Model Working Group"
    year: "2020"
    language: "English"
    publication: "Zenodo"
    url: "https://zenodo.org/records/3909563"
    extra_url: ""
    doi: "10.15497/rda00050"
    abstract: "Findability, Accessibility, Interoperability and Reusability – the FAIR principles – intend to define a minimal set of related but independent and separable guiding principles and practices that enable both machines and humans to find, access, interoperate and re-use data and metadata. The FAIR principles were defined in 2016 in an article by Mark Wilkinson et. al1. FORCE112 and GO FAIR3 provide further information on the principles. The principles have to be considered as inspiring concepts but not strict rules. This means that they may lead to diverse interpretations and ambiguity. To remedy the proliferation of FAIRness measurements based on different interpretations of the principles, the RDA Working Group “FAIR data maturity model” established in January 2019 aims to develop a common set of core assessment criteria for FAIRness, as an RDA Recommendation. In the course of 2019 and the first half of 2020, the WG established a set of indicators and maturity levels for those indicators. As a result of the work, a first set of guidelines and a checklist related to the implementation of the indicators were produced, with the objective to further align the guidelines for evaluating FAIRness with the needs of the community."
