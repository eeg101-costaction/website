    extra_url: ""
    doi: "10.3791/57165-v"
    abstract: "Portable neuroimaging approaches provide new advances to the study of brain function and brain development with previously inaccessible populations and in remote locations. This paper shows the development of field functional Near Infrared Spectroscopy (fNIRS) imaging to the study of child language, reading, and cognitive development in a rural village setting of Côte d'Ivoire. Innovation in methods and the development of culturally appropriate neuroimaging protocols allow a first-time look into the brain's development and children's learning outcomes in understudied environments. This paper demonstrates protocols for transporting and setting up a mobile laboratory, discusses considerations for field versus laboratory neuroimaging, and presents a guide for developing neuroimaging consent procedures and building meaningful long-term collaborations with local government and science partners. Portable neuroimaging methods can be used to study complex child development contexts, including the impact of significant poverty and adversity on brain development. The protocol presented here has been developed for use in Côte d'Ivoire, the world's primary source of cocoa, and where reports of child labor in the cocoa sector are common. Yet, little is known about the impact of child labor on brain development and learning. Field neuroimaging methods have the potential to yield new insights into such urgent issues, and the development of children globally."
