  - id: "JEMSH7RC"
    title: "Ethics By Design and Ethics of Use Approaches for Artificial Intelligence"
    type: "webpage"
    type_label: "Webpage"
    family: "webpage"
    family_label: "Web page"
    creators: "European Comission"
    year: ""
    language: "Unknown"
    publication: ""
    url: "https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/horizon/guidance/ethics-by-design-and-ethics-of-use-approaches-for-artificial-intelligence_he_en.pdf"
    extra_url: ""
    doi: ""
    abstract: "This Guidance concerns all research activities involving the development or/and use of artificial intelligence (AI)-based systems or techniques, including robotics. It builds on the work of the Independent High-Level Expert Group on AI and their ‘Ethics Guidelines for Trustworthy AI’ as well as on the results of the EU-funded SHERPA and SIENNA projects. This document offers guidance for adopting an ethically-focused approach while designing, developing, and deploying and/or using AI based solutions. It explains the ethical principles which AI systems must support and discusses the key characteristics that an AI-based system/ applications must have in order to preserve and promote: - respect for human agency; - privacy, personal data protection and data governance; - fairness; - individual, social, and environmental well-being; - transparency; - accountability and oversight. Furthermore, it details specific tasks which must be undertaken in order to produce an AI which possess these characteristics. For researchers who intend to use existing AI-based systems for their research, this document details ethical features which should be present in those systems to enable their use. The central approach used in this guidance is known as “Ethics by Design.” The aim of Ethics by Design is to incorporate ethical principles into the development process allowing that ethical issues are addressed as early as possible and followed up closely during research activities. It explicitly identifies concrete tasks which can be taken and can be applied to any development methodology (e.g. AGILE, V-Method or CRISP-DM). However, the advised approach should be tailored to the type of research being proposed keeping also in mind that ethics risks can be different during the research phase and the deployment or implementation phase. The Ethics by Design approach presented in this guideline offers an additional tool for addressing ethics-related concerns and for demonstrating ethics compliance. The adoption of the ethics by design approach, however, does not preclude additional measures to ensure adherence to all major AI ethics principles and compliance with the EU legal framework, in order to guarantee full ethical compliance and implementation of the ethical requirements."
    video_id: ""
    zotero_url: "https://www.zotero.org/groups/5794905/items/JEMSH7RC"
    sections: ["responsibility"]
    section_titles: ["Responsibility"]
    parts: [3]
    tags: []
