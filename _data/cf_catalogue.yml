  - id: "UBDTFXPX"
    title: "Living with AI - A Philosophical Toolkit for Navigating the Conceptual Challenges of Artificial Intelligence Systems"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Roberto Casati, Piera Maurizio, Quentin Coudray, Alda Mari, Gloria Origgi"
    year: "2025"
    language: "English"
    publication: "Zenodo"
    url: "https://zenodo.org/doi/10.5281/zenodo.18000868"
    extra_url: ""
    doi: "10.5281/ZENODO.18000868"
    abstract: "This policy brief examines how contemporary AI systems (especially generative systems used in everyday, non-expert interactions) destabilize core concepts through which societies organize responsibility, meaning, creativity, and agency. Rather than treating these disruptions as primarily technical or regulatory problems, the brief argues that they are fundamentally conceptual. It proposes a strategy of conceptual forcing: for the sake of practical governance, current and foreseeable AI systems are treated as non-conscious, non-creative, nonresponsible, and non-intentional, regardless of their appearance. Through four case studies (consciousness, creativity, meaning, and personhood), the brief shows how AI systems generate powerful illusions of mentality that shape user expectations and social practices, often independently of explicit beliefs. These effects arise from design and training choices, not from machine cognition. The brief argues that effective AI governance therefore requires integrating conceptual engineering into design, communication, and policy, in order to preserve epistemic integrity, prevent responsibility displacement, and guide human-AI interaction in socially and democratically grounded ways."
