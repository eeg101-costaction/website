    title: "Systemic Racism in EEG Research: Considerations and Potential Solutions"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Tricia Choy, Elizabeth Baker, Katherine Stavropoulos"
    year: "2022"
    language: "English"
    publication: "Affective Science"
    url: ""
    extra_url: ""
    doi: "10.1007/s42761-021-00050-0"
    abstract: "The current theoretical paper discusses the unintended systemic racism and racial biases that impact neuroscience, specifically in research utilizing electroencephalography (EEG). As a popular technique in affective science research, EEG requires adherence between the electrode and scalp to measure brain activity. To obtain high-quality data, various factors such as hair length, hair type, body movement, and/or extraneous noise from the environment are taken into consideration. As EEG researchers attempt to gather good-quality data, the recruitment and retention of Black American participants is challenging due to hairstyles commonly worn by Black American participants (e.g., cornrows, braids) and hair type. Taken together, the systemic lack of data from Black American participants renders research findings less generalizable and causes disparities in theoretical knowledge applicable to this population. To address this disparity, innovative solutions invented by bioengineers are discussed."
