    creators: "Max Korbmacher, Flavio Azevedo, Charlotte R. Pennington, Helena Hartmann, Madeleine Pownall, Kathleen Schmidt, Mahmoud Elsherif, Nate Breznau, Olly Robertson, Tamara Kalandadze, Shijun Yu, Bradley J. Baker, Aoife O’Mahony, Jørgen Ø-S. Olsnes, John J. Shaw, Biljana Gjoneska, Yuki Yamada, Jan P. Röer, Jennifer Murphy, Shilaan Alzahawi, Sandra Grinschgl, Catia M. Oliveira, Tobias Wingen, Siu Kit Yeung, Meng Liu, Laura M. König, Nihan Albayrak-Aydemir, Oscar Lecuona, Leticia Micheli, Thomas Evans"
    year: "2023"
