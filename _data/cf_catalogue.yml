  - id: "K36S7F6F"
    title: "Inclusive mobile brain-body imaging achieves equivalent EEG data quality across racial groups"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Sodiq Fakorede, Ke Liao, KathleenMae Rogers, Kai Cheng, Lydia Pemberton, Laura E. Martin, Hannes Devos"
    year: "2026"
    language: "English"
    publication: "PLOS Digital Health"
    url: "https://journals.plos.org/digitalhealth/article?id=10.1371/journal.pdig.0001638"
    extra_url: ""
    doi: "10.1371/journal.pdig.0001638"
    abstract: "Electroencephalography (EEG) research systematically excludes participants with textured hair, limiting generalizability. While inclusive hardware offers a solution, it remains unvalidated in dynamic settings. This study bridges this ecological gap by determining if equitable data quality is achievable across racial groups during a complex Mobile Brain/Body Imaging (MoBI) paradigm. We recruited 17 older adults from racially and ethnically underrepresented groups (REUG) and 17 age-and-sex-matched White older adults. Participants completed an auditory oddball task while sitting and during active standing. EEG was recorded using a dry-brush-electrode system paired with culturally sensitive procedures. The primary outcome was event-related potential (ERP) data quality, quantified using the Standardized Measurement Error (SME) for P3 amplitude and latency. Total data loss was comparable between White (8.29%) and REUG participants (9.88%), with no group differences (p = 0.91) or group×condition interactions (p = 0.82). We found no significant main effects of group or group-by-condition interactions on any SME measure (all p > 0.05), and equivalence testing confirmed that SME for P3 amplitude and latency was statistically equivalent in 16 of 18 stimulus × postural comparisons. A sensitivity analysis restricting the REUG group to participants with textured hair (REUG-T, n = 9) yielded a near-identical pattern (15 of 18 comparisons). Signal‑to‑noise ratio at Fz for frequent stimuli increased from sitting to standing (F = 10.33, p = 0.002, adjusted p = 0.036). Behavioral performance was similar across groups. This study provides the first evidence that equitable ERP data quality is achievable across racial groups during active MoBI by combining inclusive hardware with culturally sensitive protocols. These findings confirm that the technological incompatibility underlying historical underrepresentation is surmountable when paired with culturally sensitive protocols, enabling more inclusive and generalizable cognitive neuroscience."
