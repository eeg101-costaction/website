  - id: "XE9NJJ4I"
    title: "The seductive allure is a reductive allure: People prefer scientific explanations that contain logically irrelevant reductive information"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Emily J. Hopkins, Deena Skolnick Weisberg, Jordan C. V. Taylor"
    year: "2016"
    language: "Unknown"
    publication: "Cognition"
    url: "https://www.sciencedirect.com/science/article/pii/S0010027716301585"
    extra_url: ""
    doi: "10.1016/j.cognition.2016.06.011"
    abstract: "Previous work has found that people feel significantly more satisfied with explanations of psychological phenomena when those explanations contain neuroscience information—even when this information is entirely irrelevant to the logic of the explanations. This seductive allure effect was first demonstrated by Weisberg, Keil, Goodstein, Rawson, and Gray (2008), and has since been replicated several times (Fernandez-Duque, Evans, Christian, & Hodges, 2015; Minahan & Siedlecki, 2016; Rhodes, Rodriguez, & Shah, 2014; Weisberg, Taylor, & Hopkins, 2015). However, these studies only examined psychological phenomena. The current study thus investigated the generality of this effect and found that it occurs across several scientific disciplines whenever the explanations include reductive information: reference to smaller components or more fundamental processes. These data suggest that people have a general preference for reductive information, even when it is irrelevant to the logic of an explanation."
