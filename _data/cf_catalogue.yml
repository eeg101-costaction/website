  - id: "MAR4XXV3"
    title: "Electricity Demand and Grid Impacts of AI Data Centers: Challenges and Prospects"
    type: "preprint"
    type_label: "Preprint"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Xin Chen, Xiaoyang Wang, Ana Colacelli, Matt Lee, Le Xie"
    year: "2026"
    language: "Unknown"
    publication: "arXiv"
    url: "http://arxiv.org/abs/2509.07218"
    extra_url: ""
    doi: "10.48550/arXiv.2509.07218"
    abstract: "The rapid growth of artificial intelligence (AI) is driving an unprecedented increase in the electricity demand of AI data centers, raising emerging challenges for electric power grids. Understanding the characteristics of AI data center loads and their interactions with the grid is therefore critical for ensuring both reliable power system operation and sustainable AI development. This paper provides a comprehensive review and vision of this evolving landscape. Specifically, this paper (i) presents an overview of AI data center infrastructure and its key components, (ii) examines the key characteristics and patterns of electricity demand across the stages of model preparation, training, fine-tuning, and inference, (iii) analyzes the critical challenges that AI data center loads pose to power systems across three interrelated timescales, including long-term planning and interconnection, short-term operation and electricity markets, and real-time dynamics and stability, and (iv) discusses potential solutions from the perspectives of the grid, AI data centers, and AI end-users to address these challenges. By synthesizing current knowledge and outlining future directions, this review aims to guide research and development in support of the joint advancement of AI data centers and power systems toward reliable, efficient, and sustainable operation."
