  - id: "WLIDZJTC"
    title: "The EEGManyPipelines Dataset: Metascientific Data on 168 Independent Analyses of a Single EEG Dataset"
    type: "preprint"
    type_label: "Preprint"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Elena Cesnaite, andrea vitale, Annalisa Pascarella, Mikkel C Vinding, Johannes Algermissen, Nastassja L Fischer, Tuomas Puoliväli, Claudia Gianelli, Charlotte R Marshall, Darinka Trübutschek, Yu-Fang Yang, Niko Busch, Gustav Nilsonne"
    year: "2025"
    language: "Unknown"
    publication: "MetaArXiv"
    url: "https://osf.io/preprints/metaarxiv/c4xwg_v1/"
    extra_url: ""
    doi: "10.31222/osf.io/c4xwg_v1"
    abstract: "There is a growing need for large-scale, global studies in response to the replication crisis, which has raised concerns across many scientific fields and prompted efforts to understand the sources of variability in research outcomes. Here we describe the EEGManyPipelines dataset: a many-analyst study aiming to examine how differences in electrophysiology (EEG) data analysis may contribute to differences in the results. We describe data shared and analyzed by 168 analyst teams. The original shared raw data consisted of behavioral data and EEG recordings of 33 participants performing a long-term memory task, together with 8 hypotheses regarding event-related potentials and time-frequency effects. Analyst teams also provided meta-scientific data detailing analysts’ approach to hypotheses: processed EEG data, scripts, and answers to questionnaires. We propose this unique dataset for future use to study analytical flexibility, research culture, and scientific decision-making. It offers a valuable tool for meta-scientific, global and multicenter studies, EEG methodology, and reproducibility studies."
