    creators: "J. Peter Rosenfeld"
    year: "2005"
    language: "Unknown"
    publication: "The Scientific Review of Mental Health Practice: Objective Investigations of Controversial and Unorthodox Claims in Clinical Psychology, Psychiatry, and Social Work"
    url: ""
    extra_url: ""
    doi: ""
    abstract: "Farwell Brain Fingerprinting is a revolutionary new technology for solving crimes, with a record of 100% accuracy in research with U.S. government agencies and other applications. The technology is fully developed and available for application in the field. The present review undertakes a careful analysis of these claims and their background with reference to the one refereed publication in a major psychophysiology journal. Prior to this analysis, the present review briefly discusses the P300 event-related brain potential. The review then closely examines Farwell's recently promoted retrospective application of BF. Finally, it highlights methodological problems associated with BF and related methods, including vulnerability to countermeasures and difficulty with developing adequate and appropriate test material, leading to the concluding impression that the claims on the BF Web site are exaggerated and sometimes misleading. One might agree about the facts that the technology is proprietary and patented and that BF has had extensive media coverage. The technology is fully developed and available for application in the field. (PsycINFO Database Record (c) 2017 APA, all rights reserved)"
