  - id: "NQTR3FLM"
    title: "Why We Need Better Ethics for Emerging Technologies"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "James H. Moor"
    year: "2005"
    language: "English"
    publication: "Ethics and Information Technology"
    url: "http://link.springer.com/10.1007/s10676-006-0008-0"
    extra_url: ""
    doi: "10.1007/s10676-006-0008-0"
    abstract: "Technological revolutions are dissected into three stages: the introduction stage, the permeation stage, and the power stage. The information revolution is a primary example of this tripartite model. A hypothesis about ethics is proposed, namely, ethical problems increase as technological revolutions progress toward and into the power stage. Genetic technology, nanotechnology, and neurotechnology are good candidates for impending technological revolutions. Two reasons favoring their candidacy as revolutionary are their high degree of malleability and their convergence. Assuming the emerging technologies develop into mutually enabling revolutionary technologies, we will need better ethical responses to cope with them. Some suggestions are oﬀered about how our approach to ethics might be improved."
