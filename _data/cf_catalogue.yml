  - id: "D8CVTEXR"
    title: "Purchases dominate the carbon footprint of research laboratories"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Marianne de Paepe, Laurent Jeanneau, Jerôme Mariette, Olivier Aumont, André Estevez-Torres"
    year: "2024"
    language: "English"
    publication: "PLOS Sustainability and Transformation"
    url: "https://journals.plos.org/sustainabilitytransformation/article?id=10.1371/journal.pstr.0000116"
    extra_url: ""
    doi: "10.1371/journal.pstr.0000116"
    abstract: "Despite increasing interest for the carbon footprint of higher education institutions, little is known about the carbon footprint associated to research activities. Air travel and attendance to conferences concentrate recent data and debates but purchases have attracted little attention. Here we develop a hybrid method to estimate the greenhouse gas emissions (GHG) associated to research purchases. To do so, we combine macroeconomic databases, research-centered companies footprints and life-cycle assessments to construct a public database of monetary emission factors (EF) for research purchases. We apply it to estimate the purchases emissions of a hundred of research laboratories in France, belonging to the Labos 1point5 network and gathering more than 20000 staff, from all disciplines. We find that purchases dominate laboratory emissions, accounting for more than 50% of emissions, with a median of 2.7 t CO2e/pers, which is 3 to 4-fold the separate contribution from travel, commutes and heating. Median electricity emissions are 5-fold lower in our dataset of laboratories using low carbon electricity but they become preponderant for high carbon electricity mixes (3.5 t CO2e/pers). Purchases emissions are very heterogeneous among laboratories and are linearly correlated with budget, with an average carbon intensity of 0.31 ± 0.07 kg CO2e/€ and differences between research domains. Finally, we quantify the effect of a series of demand-driven mitigation strategies obtaining up to −20% in total emissions (−40% in purchases emissions), suggesting that effectively reducing the carbon footprint of research activities calls for systemic changes."
