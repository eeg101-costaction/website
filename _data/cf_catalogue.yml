  - id: "SJXBYI2I"
    title: "48-hour video-EEG monitoring for epilepsy presurgical evaluation is cost-effective and safe in resource-limited setting"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Kheng-Seang Lim, Si-Lei Fong, Minh-An Thuy Le, Sherrini Ahmad Bazir, Vairavan Narayanan, Noraini Ismail, Shweh-Fern Loo, Kohila Krishnan, Chong-Tin Tan"
    year: "2020"
    language: "English"
    publication: "Epilepsy Research"
    url: "https://linkinghub.elsevier.com/retrieve/pii/S0920121119305868"
    extra_url: ""
    doi: "10.1016/j.eplepsyres.2020.106298"
    abstract: "Introduction: Video-EEG monitoring is one of the key investigations in epilepsy pre-surgical evaluation but limited by cost. This study aimed to determine the eﬃcacy and safety of a 48-hour (3-day) video EEG monitoring, with rapid pre-monitoring antiepileptic drugs withdrawal. Material and methods: This is a retrospective study of epilepsy cases with VEM performed in University Malaya Medical Center (UMMC), Kuala Lumpur, from January 2012 till August 2016. Results: A total of 137 cases were included. The mean age was 34.5 years old (range 15–62) and 76 (55.8 %) were male. On the ﬁrst 24 -h of recording (D1), 81 cases (59.1 %) had seizure occurrence, and 109 (79.6 %) by day 2 (D2). One-hundred and nine VEMs (79.6 %) were diagnostic, in guiding surgical decision or further investigations. Of these, 21 had less than 2 seizures recorded in the ﬁrst 48 h but were considered as diagnostic because of concordant interictal ± ictal activities, or a diagnosis such as psychogenic non-epileptic seizure was made. Twenty-eight patients had extension of VEM for another 24−48 h, and 11 developed seizures during the extension period. Extra-temporal lobe epilepsy and seizure frequency were signiﬁcant predictors for diagnostic 48 -h VEM. Three patients developed complications, including status epilepticus required anaesthetic agents (1), seizure clusters (2) with postictal psychosis or dysphasia, and all recovered subsequently. Conclusions: 48-h video EEG monitoring is cost-eﬀective in resource limited setting. 1. Introduction Epilepsy surgery has been described as “arguably the most underutilized of all accepted therapeutic interventions in the entire ﬁeld of medicine” (Engel, 2009). Epilepsy surgical treatment gap is deﬁned as the proportion of individuals with epilepsy who require but do not receive surgical treatment (Jette et al., 2016).. In United States, 3000–4000 surgeries are performed each year, but there are an estimated 100,000–200,000 surgical candidates, suggesting a surgical treatment gap of between 96 % and 99 % (England et al., 2012). In Southeast Asian countries, epilepsy surgery is reported to be underutilised (Thuy Le et al., 2019). The barriers can be due to patient and family, and physician and health factors. However, in low-income countries, the ﬁrst key barrier will be lack of services such as video-EEG monitoring, limited by health resources."
