  - id: "39S9SMDL"
    title: "Optimizing Readability and Format of Plain Language Summaries for Medical Research Articles: Cross-sectional Survey Study"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Leia Martínez Silvagnoli, Caroline Shepherd, James Pritchett, Jason Gardner"
    year: "2022"
    language: "English"
    publication: "Journal of Medical Internet Research"
    url: "https://www.jmir.org/2022/1/e22122"
    extra_url: ""
    doi: "10.2196/22122"
    abstract: "Background: Plain language summaries (PLSs) are intended to provide readers with a clear, nontechnical, and easily understandable overview of medical and scientific literature; however, audience preferences for specific PLS formats have yet to be fully explored. Objective: This study aims to evaluate the preferred readability level and format for PLSs of medical research articles of different disease states via a web-based survey of audiences of different age groups. Methods: Articles describing phase III clinical trials published in top-level, peer-reviewed journals between May 2016 and May 2018 were identified for 3 chronic disease states representing a range of adult patient age groups: (1) psoriasis, a skin disease representative of younger patients; (2) multiple sclerosis (MS), a neurological disease representative of middle-aged patients; and (3) rheumatoid arthritis (RA), a painful joint disease representative of older patients. Four PLSs were developed for each research article, of which 3 were text-only summaries (written with high, medium, and low complexity) and 1 was an infographic. To evaluate each of the 4 PLS formats, a 20-question open survey (specific to one of the 3 diseases) was sent to a representative sample selected via UK-based patient association websites, Twitter, and Facebook patient groups. A weighted-average calculation was applied to respondents’ ranked preferences for each PLS format. Results: For all 3 articles, the weighted-average preference scores showed that infographic (psoriasis 2.91, MS 2.71, and RA 2.78) and medium-complexity text-based PLS (reading age 14-17 years, US Grade 9-11; psoriasis 2.90; MS 2.47; RA 2.77) were the two most preferred PLS formats. Conclusions: Audience preferences should be accounted for when preparing PLSs to accompany peer-reviewed original research articles. Oversimplified text can be viewed negatively, and graphical summaries or medium-complexity text-based summaries appear to be the most popular."
