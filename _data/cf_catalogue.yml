  - id: "FPIYAQRK"
    title: "Bringing academia within its safe and just space: reflections on activating scientists"
    type: "preprint"
    type_label: "Preprint"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Anne E. Urai, Clare Kelly"
    year: "2024"
    language: "English"
    publication: "OSF"
    url: "https://osf.io/um47d_v1"
    extra_url: ""
    doi: "10.31219/osf.io/um47d"
    abstract: "While academic climate activism is on the rise, most universities and scientific communities remain woefully underprepared to deal with the ‘wicked’ problems of climate change and biodiversity loss. Using Kate Raworth’s Doughnut Economics framework, we previously proposed a vision of academia that respects human and planetary boundaries (Urai and Kelly, 2023), offering a call to action that starts with culture change in scientific communities. Here, we reflect on the origin of our ideas and on the process of developing a participatory workshop that aims to catalyze the process of culture change. To encourage independent dissemination and wider engagement, we provide a set of best practices for hosting the workshop. Finally, we reflect on the value of such bottom-up approaches in academia, theories of change, and a vision for a way forward."
