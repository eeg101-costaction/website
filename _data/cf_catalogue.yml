  - id: "RRE5XMJS"
    title: "Transition 1point5, the platform for French academic research laboratories engaged in their environmental transition"
    type: "manuscript"
    type_label: "Manuscript"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Annunziata Savoia, Emilie Jardé, Louise Mimeau, Roxane Choteau-Bernet, Céline Serrano, Matthieu Simonin, Sophie Schbath, Françoise Immel, Muriel Andrieu, Laurent Pagani, Marie-Alice Foujols"
    year: "2026"
    language: "Unknown"
    publication: ""
    url: "https://hal.science/hal-05508584"
    extra_url: ""
    doi: ""
    abstract: "This article presents an analysis, quantitative and qualitative, of the actions shared by French laboratories on the Transition 1point5 platform. This is an open-source web application, developed by the French research group Labos 1point5, that allows volunteer French laboratories to share the measures -the actions-they have taken to reduce their environmental footprint. We present the analysis of the 274 actions shared by 69 laboratories on the platform on 11 June 2025, addressing the following questions. What measures are research laboratories implementing to adopt sustainable practices? Is there a single transition path that applies to all laboratories? What role do awareness-raising initiatives play in this process? Can participatory workshops add value to the transition process? Have laboratories undergoing transition effectively reduced their GHG (greenhouse gases) emissions? The main result of this study is that, rather than a single transition pathway, the platform's laboratories employ various approaches depending on their specific characteristics. These approaches share common features, such as the use of awareness-raising activities, the creation of working groups dedicated to environmental issues, and increasingly participatory workshops to discuss and implement transition actions. Another key finding is that it is too early to measure the effectiveness of the implemented measures in terms laboratories' GHG (greenhouse gas) reductions, since most of the laboratories only implemented their actions in 2024 or early 2025. Nevertheless, the platform provides valuable insights into how research laboratories are engaging in the transition, revealing organizational processes and demonstrating that another way to do research is explored."
