    url: "https://eegmanypipelines.github.io/index.html"
    extra_url: ""
    doi: ""
    abstract: "This project is inspired by other recent projects involving many independent analysis teams to investigate how different analysts approach a given data set and how analysis approaches affect the obtained results (e.g., Silberzahn et al., 2015; Botvinik-Nezer et al., 2020). The aim of this project is to extend this novel initiative to EEG research. We believe this to be particularly important in the case of EEG data, as compared to other neuroimaging research, analysis pipelines are less standardized (e.g. see Cohen, 2017) and have more degrees of freedom. EEG is the most widespread tool in human neuroscience research with significant impact on research in all fields of psychology and cognitive neuroscience, which, we believe, makes the EEGManyPipelines project a timely and crucial endeavor that we hope will benefit a large part of the cognitive neuroscience community."
