    title: "The Advantage of Big Team Science: Lessons Learned From Cognitive Science"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "David C. Vaidis, Jacob F. Miranda, Erin M. Buchanan, Yu Fang Yang, Marta Kowal, Kathleen Schmidt, Marta Topor, Michal Misiak, Rachael Miller, John Protzko, Biljana Gjoneska, Jeremy K. Miller, Anna Exner, Flavio Azevedo, Mariola Paruzel-Czachura, Faisal Mushtaq, Catia Oliveira, Jordan R. Wagge, Delphine De Moor, Niels G. Mede, Drew M. Altschul, Yuri G. Pavlov, Yashvin Seetahul, Leanne Boucher, Kimberly C. Doell, Ingmar Visser, Mahmoud M. Elsherif, Ekaterina Pronizius"
    year: "2026"
