  - id: "PEV5ZN3V"
    title: "A short guide to addressing accessibility at scientific conferences"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Urszula Lucja McClurg"
    year: "2024"
    language: "Unknown"
    publication: "Journal of Cell Science"
    url: "https://doi.org/10.1242/jcs.261858"
    extra_url: ""
    doi: "10.1242/jcs.261858"
    abstract: "Although encouraging progress to address issues of accessibility at scientific conferences has been made in recent years, further efforts are required to enact the comprehensive solutions necessary to accommodate the diverse needs of disabled scientists. This Opinion provides an easy-to-follow guide to ensuring that scientific conferences are accessible to disabled scientists and is aimed at conference organizers and funders in the field of cell biology. In this piece, I, a person who identifies as a disabled scientist, advocate for collective action within the cell biology community to promote the routine inclusion of accessibility officers on conference organizing panels and the use of accessibility checklists as part of applications for conference funding in order to build inclusive practices into conference planning and organization. I propose a move away from requiring personal disclosures of disability needs on a person-to-person basis towards community-agreed guidelines that ensure accessibility for scientists with a wide variety of needs. To that end, I detail a list of practical, cost-effective adjustments to standard conference activities that can enhance accessibility. Moreover, I suggest several long-term, high-impact changes – including guaranteeing the availability of wheelchair-accessible facilities and making hybrid meeting formats standard – aimed at enabling conference participation for all scientists."
