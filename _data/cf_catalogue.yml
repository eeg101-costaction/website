  - id: "79YKFPTU"
    title: "Novel Neurorights: From Nonsense to Substance"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Jan Christoph Bublitz"
    year: "2022"
    language: "English"
    publication: "Neuroethics"
    url: "https://link.springer.com/10.1007/s12152-022-09481-3"
    extra_url: ""
    doi: "10.1007/s12152-022-09481-3"
    abstract: "This paper analyses recent calls for so called “neurorights”, suggested novel human rights whose adoption is allegedly required because of advances in neuroscience, exemplified by a proposal of the Neurorights Initiative. Advances in neuroscience and technology are indeed impressive and pose a range of challenges for the law, and some novel applications give grounds for human rights concerns. But whether addressing these concerns requires adopting novel human rights, and whether the proposed neurorights are suitable candidates, are a different matter. This paper argues that the proposed rights, as individuals and a class, should not be adopted and lobbying on their behalf should stop. The proposal tends to promote rights inflationism, is tainted by neuroexceptionalism and neuroessentialism, and lacks grounding in relevant scholarship. None of the proposed individual rights passes quality criteria debated in the field. While understandable from a moral perspective, the proposal is fundamentally flawed from a legal perspective. Rather than conjuring up novel human rights, existing rights should be further developed in face of changing societal circumstances and technological possibilities."
