    url: "http://archive.org/details/humancondition0000aren"
    extra_url: ""
    doi: ""
    abstract: "332 pages ; 24 cm; A work of striking originality bursting with unexpected insights, The Human condition is in many respects more relevant now than when it first appeared in 1958. In her study of the state of modern humanity, Hannah Arendt considers humankind from the perspective of the actions of which it is capable. The problems Arendt identified then--diminishing human agency and political freedom, the paradox that as human powers increase through technological and humanistic inquiry, we are less equipped to control the consequences of our actions--continue to confront us today. This new edition, published to coincide with the fortieth anniversary of its original publication, contains an improved and expanded index and a new introduction by noted Arendt scholar Margaret Canovan which incisively analyzes the book's argument and examines its present relevance. A classic in political and social theory, The Human condition is a work that has proved both timeless and perpetually timely; American Political Science Association Benjamin E. Lippincott Award, 1975; I. The human condition. Vita activa and the human condition ; The term vita activa ; Eternity versus immortality -- II. The public and the private realm. Man : a social or a political animal ; The polis and the household ; The rise of the social ; The public realm : the common ; The private realm : property ; The social and the private ; The location of human activities -- III. Labor. \"The labour of our body and the work of our hands\" ; The thing-character of the world ; Labor and life ; Labor and fertility ; The privacy of property and wealth ; The instruments of work and the division of labor ; A consumers' society -- IV. Work. The durability of the world ; Reification ; Instrumentality and animal laborans ; Instrumentality and homo faber ; The exchange market ; The permanence of the world and the work of art -- V. Action. The disclosure of the agent in speech and action ; The web of relationships and the enacted stories ; The frailty of human affairs ; The Greek solution ; Power and the space of appearance ; Homo faber and the space of appearance ; The labor movement ; The traditional substitution of making for acting ; The process character of action ; Irreversibility and the power to forgive ; Unpredictability and the power of promise -- VI. The Vita Activa and the modern age. World alienation ; The discovery of the Archimedean point ; Universal versus natural science ; The rise of the Cartesian doubt ; Introspection and the loss of common sense ; Thought and the modern world view ; The reversal of contemplation and action ; The reversal within the vita activa and the victory of homo faber ; The defeat of homo faber and the principle of happiness ; Life as the highest good ; The victory of the animal laborans; Includes bibliographical references and index"
