    title: "Expert opinions on pediatric EEG training for non-epilepsy specialists in sub-Saharan Africa"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Veena Kander, Kette D. Valente, Jaime Carrizosa, Jorge Vidaurre, Archana A. Patel, Chahnez Charfi Triki, Ghaieb Aljandeel, Gagandeep Singh, Mitsuhiro Kato, Lala Seck, Zeinab Kone, Sándor Beniczky, Melody T. Asukile, Gretchen L. Birbeck, Kevin Jones, Geraldine Boylan, Joanne Hardman, Jo M. Wilmshurst"
    year: "2025"
    language: "English"
    publication: "Epileptic Disorders"
    url: "https://onlinelibrary.wiley.com/doi/abs/10.1002/epd2.70010"
    extra_url: ""
    doi: "10.1002/epd2.70010"
    abstract: "Ideally, pediatric electroencephalograms (EEGs) should be performed by accredited neurophysiology technologists and interpreted by specialists trained in epileptology However, low- and middle-income countries (LMICs) lack such specialists. Aim To collate expert consensus on essential curriculum content for non-epilepsy specialists in EEG interpretation and safe post-training practice. Method A qualitative study on pediatric EEG training curricula needs was designed in collaboration with an adult education specialist. Data were collected via interviews from 15 epilepsy experts with training experience across high- to low-income settings. Thematic analysis was used to identify sub-themes. The experts voted on the key statements in a two-round Delphi to ascertain consensus. Results Twelve aspects of pediatric EEG training were identified and categorized thematically: relevance; exposure to pediatrics; focus on pediatrics; barriers; resource-limited setting; entry skills; best pedagogy; assessment; critical skills; reinforcement of skills; training model; and recommendations. Conclusion This study was driven by the inadequate access to training in pediatric EEG for non-epilepsy specialists, which is further exacerbated by the lack of epileptologists and neurophysiologists. The outcomes from the expert consensus opinions promoted consolidation, adaptation, and evolution of existing models that are viable for practice and to be used worldwide. The Delphi consensus demonstrated alignment among regionally located specialists towards the promotion of effective and maintained training for non-epilepsy specialists, as well as highlighting barriers that should be considered and addressed."
