  - id: "JIY9WBVI"
    title: "Artificial Intelligence and Data Visitation (AIDV) WG"
    type: "blogPost"
    type_label: "Blog Post"
    family: "webpage"
    family_label: "Web page"
    creators: ""
    year: ""
    language: "English"
    publication: ""
    url: "https://www.rd-alliance.org/groups/artificial-intelligence-and-data-visitation-aidv-wg/activity/"
    extra_url: ""
    doi: ""
    abstract: "Group Details : Mission The mission of the AIDV-WG is to contribute to building the ethical, legal, social, and technical frameworks for Artificial Intelligence while examining the potential of data visitation to bridge challenges for the open sharing and re-use of data in the framework of Open Science. Vision The vision of the AIDV-WG is to bring together expertise across disciplines and regions to ensure ameliorate the use of AI in research and innovation across technologies and sectors to address the grand challenges of society while promoting an understanding of how data visitation can contribute to improved data sharing. Objectives The principal objective of AIDV-WG is to examine the promises, challenges, and barriers to the use of AI in data sharing and Open Science having regard to scientists and research institutions as well as to policy and the interests of patients, communities, health advocates, and those stakeholders otherwise underrepresented in these important initiatives for Open Science. The EOSC-Future/RDA Artificial Intelligence and Data Visitation Working Group (AIDV-WG) received funding from the European Commission under the Horizon2020 Programme with Grant Agreement Number 101017536 through the European Open Science Cloud – Future Project (EOSC-Future). The project was proposed and is coordinated by Francis P. Crawley with the Good Clinical Practice Alliance – Europe (GCPA). The AIDV-WG was the first RDA working group fully dedicated to an investigation of the transformative impact on science and education of AI as well the first to explore data visitation in the newly emerging regulatory environments. The AIDV-WG It further enjoys support from the RDA TIGER programme funded under the Horizon Europe Grant agreement ID: 101094406. The AIDV-WG’s guidance outputs have been designed to support the governance framework of EOSC and the facilitation of the implementation of EOSC across research communities. The AIDV has developed international guidance documents on informed consent for AD and DV, for ethical review for AI & DV, and a model framework for an AI Bill of Rights. This set of guidance documents involved a fully global community of experts along with 8 mentees under the direction of the Coordinator and attached to the workstreams. The AIDV-WG also established pathways to global and institutional implementation of the guidance documents. The following work packages are being pursued by AIDV subteams: A survey on current ethical, legal, policy, and societal frameworks for AI and DV Guidance on Secured Processing Environments for Open Science for AI and DV: a mapping of legal considerations forAI and DV as well as how to navigate legal frameworks for users of EOSC and other Open Science platforms. Guidance for informed consent in AI and DV: The GDPR and other EU data and AI regulations as well as regulations in other jurisdictions have placed heavy emphasis on the role of informed consent in data sharing and data publication. This subteam examines the role of informed consent in AI and DV, addressing fundamental challenges to current informed consent frameworks and practices. The aim is to provide guidance for researchers and data controllers across disciplines regarding informed consent in AI and DV. Guidance for ethics committees reviewing AI and DV: Ethics committees (RECs/IRBs/IECs) have been confronted by new challenges when encountering the need for advice on data management and data sharing as well as in other areas of data processing. The use of AI and DV, especially in health-related research, requires investigation with regard to the ethical, legal, and social issues these raise for ethics committees and those submitting proposals for advice/approval to ethics committees. This subteam’s guidance will assist ethics committees in understanding questions, methods, and procedures for reviewing AI and DV. AI Bill of Rights: Underlying the growing application and use of AI and DV is a concern to ensure that data subjects are protected by these new technologies. The AIDV-WG subteam has drafted an RDA AI Bill of Rights Recommendations Communique that promotes fundamental human rights and advances trust in AI and federated systems for Open Science."
