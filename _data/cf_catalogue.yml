    abstract: "ReproducibiliTea is a grassroots journal club initiative aiming to improve research practices from the bottom up. The idea is simple: Get a group of aspiring early career researchers (ECRs) together, drink tea, and critically discuss issues surrounding reproducibility, open research, and academic culture. In this paper, we as past and present members of the ReproducibiliTea Global Steering Committee have drawn on our experience and that of our wider network to offer you 10 simple rules for organising a ReproducibiliTea journal club. Our aim is to equip you as an ECR with the tools needed to lead grassroots change in research culture. Whether you are launching your first meeting or sustaining a long-running JC, these rules are designed to help you brew a welcoming, impactful, and inspired community – one cup of tea at a time."
