  - id: "C26PD8NT"
    title: "Neuroelectromagnetic Data Archive and Repository: Open-source platform analysis"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Tracy Brandmeyer, Anna Riggs, Viraaj Reddi, Hayley Sullivan, Choonhan Youn, Subhashini Sivagnanam, Kenneth Yoshimoto, Russell A. Poldrack, Nell Hardcastle, Christopher Markiewicz, Amitava Majumdar, Yahya Shirazi, Dung Truong, Scott Makeig, Arnaud Delorme"
    year: "2026"
    language: "English"
    publication: "Aperture Neuro"
    url: "https://apertureneuro.org/article/154162-neuroelectromagnetic-data-archive-and-repository-open-source-platform-analysis"
    extra_url: ""
    doi: "10.52294/001c.154162"
    abstract: "Open data infrastructures are rapidly reshaping the landscape of neuroscience by enabling greater reproducibility through transparency, reusability, and collaboration, thus providing a foundation for sustainable and scalable scientific progress. This paper presents a systematic audit of the Neuroelectromagnetic Data Archive and Repository (NEMAR), a platform supporting the sharing and reuse of EEG, MEG, and iEEG datasets standardized through the Brain Imaging Data Structure (BIDS) format. Drawing on a detailed analysis of over 300 publicly available datasets, we assess the composition, metadata quality, and population coverage of data in NEMAR. Our findings reveal significant momentum in data sharing practices, particularly in EEG, and highlight key challenges, including inconsistent metadata, underrepresentation of clinical populations, and variable adherence to data standards. These insights highlight the importance of targeted support for policy and cultural development to ensure open repositories like NEMAR are not only accessible but also equitable, reusable, and scientifically robust."
