    url: "https://almasiproject.org/"
    extra_url: ""
    doi: ""
    abstract: "The ALMASI project (Aligning and Mutualizing Nonprofit Open Access Publishing Services Internationally) seeks to develop a nonprofit, high-quality, and sustainable scholarly communication ecosystem across Africa, Europe, and Latin America. Funded by the European Union’s Horizon Europe research and innovation programme, this three-year collaborative initiative involves 16 partners from three continents. The ALMASI project will work towards: A better understanding of the current landscape of nonprofit OA publishing in the three regions; Co-designing and aligning measures for quality standards, training resources, as well as institutional and national policy development to ensure the sustainability of nonprofit OA publishing. This will enable scholarly communities to take full responsibility for innovative, valid, reliable and accessible publishing services and solutions that do not charge fees to readers or authors, commonly referred to as Diamond Open Access. An aligned nonprofit publishing ecosystem will take into account specific needs across the diversity of disciplines, geographical regions, and languages. It will focus on the harmonization and consolidation of existing nonprofit publishing services and solutions, and establish a common framework for knowledge transfer, coordination, and strategic alignment. The ALMASI project is carried out as a pilot project contributing to a Global Diamond Alliance."
