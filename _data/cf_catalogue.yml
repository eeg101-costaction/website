    publication: "Collabra: Psychology"
    url: "https://online.ucpress.edu/collabra/article/12/1/160129/218054/The-Advantage-of-Big-Team-Science-Lessons-Learned"
    extra_url: ""
    doi: "10.1525/collabra.160129"
    abstract: "The credibility revolution in psychology and related sciences contributed to the adoption of large-scale research initiatives known as Big Team Science (BTS). BTS has made significant advances in addressing issues of replication, statistical power, and diversity through the use of larger samples and more representative cross-cultural data. However, while these collaborations hold great potential, they also introduce unique challenges related to their scale. Drawing on experiences from successful BTS projects, we identified and outlined key strategies for overcoming diversity, volunteering, and capacity challenges. We emphasize the need for clear role definitions, structured and preregistered workflows, centralized project management, and transparent decision documenting to prevent common pitfalls. Ultimately, we call for reflection on the strengths and limitations of BTS to enhance the quality, generalizability, and impact of research across disciplines. This work complements existing BTS guides by offering experientially-grounded, discipline-specific strategies and addressing underexplored logistical, ethical, and epistemological challenges in large-scale collaborations."
