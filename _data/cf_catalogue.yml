  - id: "KAN6HF2B"
    title: "Estimate of the carbon footprint of astronomical research infrastructures"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Jürgen Knödlseder, Sylvie Brau-Nogué, Mickael Coriat, Philippe Garnier, Annie Hughes, Pierrick Martin, Luigi Tibaldo"
    year: "2022"
    language: "English"
    publication: "Nature Astronomy"
    url: "https://www.nature.com/articles/s41550-022-01612-3"
    extra_url: ""
    doi: "10.1038/s41550-022-01612-3"
    abstract: "The carbon footprint of astronomical research is an increasingly topical issue with first estimates of research institute and national community footprints having recently been published. As these assessments have typically excluded the contribution of astronomical research infrastructures, we complement these studies by providing an estimate of the contribution of astronomical space missions and ground-based observatories using greenhouse gas emission factors that relates cost and payload mass to carbon footprint. We find that worldwide active astronomical research infrastructures currently have a carbon footprint of 20.3 ± 3.3 MtCO2 equivalent (CO2e) and an annual emission of 1,169 ± 249 ktCO2e yr−1 corresponding to a footprint of 36.6 ± 14.0 tCO2e per year per astronomer. Compared with contributions from other aspects of astronomy research activity, our results suggest that research infrastructures make the single largest contribution to the carbon footprint of an astronomer. We discuss the limitations and uncertainties of our method and explore measures that can bring greenhouse gas emissions from astronomical research infrastructures towards a sustainable level."
