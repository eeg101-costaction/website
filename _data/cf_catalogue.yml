  - id: "ERH4GMV3"
    title: "The effects of diversity on creativity: A literature review and synthesis"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Andreas Hundschell, Stefan Razinskas, Julia Backmann, Martin Hoegl"
    year: "2022"
    language: "English"
    publication: "Applied Psychology"
    url: "https://onlinelibrary.wiley.com/doi/abs/10.1111/apps.12365"
    extra_url: "https://onlinelibrary.wiley.com/doi/pdf/10.1111/apps.12365"
    doi: "10.1111/apps.12365"
    abstract: "In today's complex business world, the diversities within organizations, within teams, and of individual employees have emerged as a source of competitive advantage that can enhance creativity at multiple levels of analysis. However, the relationship between diversity and creativity at and across the individual, team, and organizational levels remains a topic of debate, despite ongoing scholarly interest. In this article, we address this debate by conducting a comprehensive multilevel review of 119 empirical studies that explores the effects of diversity on creativity. To structure this body of literature, we review studies based on their levels of analysis as well as the degrees of job-relatedness and the observability of diversity attributes they investigate. This approach helps to enable the discussion of the differential effects that numerous diversity attributes can have on creativity at the individual, team, and organizational levels, thus uncovering promising avenues for future research. Our multilevel perspective particularly points toward the heightened need for more cross-level and dynamic research designs and for extending conceptual ideas well known at one level of analysis to phenomena less understood at other levels of analysis. These approaches should improve the understanding of the complex, and therefore still puzzling, role of diversity for creativity."
