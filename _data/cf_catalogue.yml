  - id: "MFHLT6AZ"
    title: "Applied human neuroscience: Fostering and designing inclusive environments with the 3E-Cognition perspective"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Francisco J. Parada, Aitana Grasso-Cladera, Alejandra Rossi, Patricia Soto-Icaza, Maritza Arenas-Pérez, María Constanza Errázuriz"
    year: "2024"
    language: "English"
    publication: "The European Journal of Neuroscience"
    url: ""
    extra_url: ""
    doi: "10.1111/ejn.16463"
    abstract: "The conventional medical paradigm often focuses on deficits and impairments, failing to capture the rich tapestry of experiences and abilities inherent in neurodiversity conditions. In this article, we introduce the 3E-Cognition perspective, offering a paradigm shift by emphasizing the dynamic interplay between the brain, body, and environment in shaping cognitive processes. The perspective fosters a more inclusive and supportive understanding of neurodiversity, with potential applications across various domains such as education, workplace, and healthcare. We begin by introducing the 3E-Cognition principles: embodied, environmentally scaffolded, and enactive. Then, we explore how the 3E-Cognition perspective can be applied to create inclusive environments and experiences for neurodiverse individuals. We provide examples in the realms of education, workplace, and healthcare. In all of these domains, spaces, methodologies, epistemologies, and roles that cater to diverse needs and strengths can be designed using the 3E principles. Finally, we discuss the challenges and benefits of implementing the 3E-Cognition perspective. We focus on the need for technological advancements and research in complex real-world scenarios; we suggest mobile brain/body imaging is a possible solution. We furthermore highlight the importance of recognizing and valuing the diverse manners of experiencing and interacting with the world, the promotion of diverse well-being, and the facilitation of innovation and creativity. Thus, we conclude that the 3E-Cognition perspective offers a groundbreaking approach to understanding and supporting neurodiversity: by embracing the inherent interconnectedness of the brain, body, and environment, we can create a more inclusive and supportive world."
