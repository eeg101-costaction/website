  - id: "JT5SQ8DI"
    title: "From Brain Maps to Cognitive Ontologies: Informatics and the Search for Mental Structure"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Russell A. Poldrack, Tal Yarkoni"
    year: "2016"
    language: "English"
    publication: "Annual Review of Psychology"
    url: "https://www.annualreviews.org/content/journals/10.1146/annurev-psych-122414-033729"
    extra_url: ""
    doi: "10.1146/annurev-psych-122414-033729"
    abstract: "A major goal of cognitive neuroscience is to delineate how brain systems give rise to mental function. Here we review the increasingly large role informatics-driven approaches are playing in such efforts. We begin by reviewing a number of challenges conventional neuroimaging approaches face in trying to delineate brain-cognition mappings—for example, the difﬁculty in establishing the speciﬁcity of postulated associations. Next, we demonstrate how these limitations can potentially be overcome using complementary approaches that emphasize large-scale analysis—including metaanalytic methods that synthesize hundreds or thousands of studies at a time; latent-variable approaches that seek to extract structure from data in a bottom-up manner; and predictive modeling approaches capable of quantitatively inferring mental states from patterns of brain activity. We highlight the underappreciated but critical role for formal cognitive ontologies in helping to clarify, reﬁne, and test theories of brain and cognitive function. Finally, we conclude with a speculative discussion of what future informatics developments may hold for cognitive neuroscience."
