  - id: "ZWVHLNTA"
    title: "OpenSky: How a Security Project Became Global Infrastructure"
    type: "conferencePaper"
    type_label: "Conference Paper"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Ivan Martinovic, Martin Strohmeier"
    year: "2026"
    language: "Unknown"
    publication: "Association for Computing Machinery"
    url: "https://dl.acm.org/doi/10.1145/3765613.3797548"
    extra_url: ""
    doi: "10.1145/3765613.3797548"
    abstract: "In 2012, the OpenSky Network (https://opensky-network.org) began as an academic experiment: a crowdsourced sensor network for studying the security of wireless aviation communication. At the time, ADS-B and related surveillance technologies were becoming central to modern aviation, yet their openness, lack of authentication, and real-world deployment at scale raised fundamental security questions.The questions that were posed by several collaborating academic security groups were: What would it take to observe, measure, and understand these systems not in a laboratory, but in the wild? What is required to scale a large distributed sensor network?More than a decade later, OpenSky has become something much larger than its founders originally imagined. Built by researchers, aviation enthusiasts, and citizen scientists, it has grown into a global non-profit infrastructure for collecting, archiving, and sharing open aviation data. Its database now contains tens of trillions of records across petabytes of data, and has supported more than 900 scientific publications in many diverse fields including aviation security, air traffic management, climate science, pandemic modelling, machine learning, economics, journalism, and public accountability. Beyond academia, it has been used by many diverse partners from EUROCONTROL to the Bank of England.This keynote tells the story of how a security research project became global infrastructure. We reflect on the technical, scientific, organizational, and ethical lessons learned while operating a long-running, crowdsourced, non-profit data collection system. We will revisit OpenSky's original motivation in aviation security, including insecure aircraft communications and later work on GNSS interference and spoofing, but also show how the same infrastructure enabled discoveries far beyond wireless security.The talk discusses the power and fragility of crowdsourced measurement: how to build trust in noisy global data, how to sustain a volunteer-based network over many years, how to balance openness with privacy and safety, and how to keep a public-good infrastructure alive in a world increasingly dominated by proprietary data platforms. The broader message is that security research infrastructure can have second lives: when built openly, carefully, and sustainably, it can become a foundation for science, society, and unexpected forms of public value."
