  - id: "R7KWAK47"
    title: "Decarbonizing research laboratories? The tensions associated with the commensurability of carbon and how it opens up the boundaries of responsibility attribution"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Antoine Hardy"
    year: "2024"
    language: "Unknown"
    publication: "Review of Agricultural, Food and Environmental Studies"
    url: "https://EconPapers.repec.org/RePEc:spr:roafes:v:105:y:2024:i:1:d:10.1007_s41130-024-00211-2"
    extra_url: ""
    doi: "10.1007/s41130-024-00211-2"
    abstract: "Abstract This article addresses the decarbonization of the French public research sector via a novel form of scientific mobilization: Labos 1point5, a group of research personnel, whose strategy is partly based on developing and then distributing a carbon calculator to estimate the quantity of greenhouse gases emitted by French public research laboratories, expressed as carbon dioxide equivalent (CO2e) or “carbon footprint.” Here, I question the effects of this quantification on laboratories’ approach to decarbonization. Commensuration of research practices through an estimation that is not centered on a specific practice (such as travel) or limited to certain instruments (e.g., telescopes, supercomputers, computer hardware) opens up the boundaries of responsibility attribution. I identify three forms of tensions that arise during this process: a tension in terms of level of responsibilities, a material and disciplinary tension, and finally, a definitional tension, in the sense of “boundary-work” (Gieryn, 1983), in which this initiative is simultaneously labeled as scientific and activist."
