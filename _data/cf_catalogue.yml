  - id: "NYTSM4HB"
    title: "Beyond neural data: Cognitive biometrics and mental privacy"
    type: "journalArticle"
    type_label: "Journal Article"
    family: "bibliographic"
    family_label: "Bibliographic"
    creators: "Patrick Magee, Marcello Ienca, Nita Farahany"
    year: "2024"
    language: "Unknown"
    publication: "Neuron"
    url: "https://www.scopus.com/pages/publications/85205151878"
    extra_url: ""
    doi: "10.1016/j.neuron.2024.09.004"
    abstract: "Innovations in wearable technology and artificial intelligence have enabled consumer devices to process and transmit data about human mental states (cognitive, affective, and conative) through what this paper refers to as “cognitive biometrics.” Devices such as brain-computer interfaces, extended reality headsets, and fitness wearables offer significant benefits in health, wellness, and entertainment through the collection and processing and cognitive biometric data. However, they also pose unique risks to mental privacy due to their ability to infer sensitive information about individuals. This paper challenges the current approach to protecting individuals through legal protections for “neural data” and advocates for a more expansive legal and industry framework, as recently reflected in the draft UNESCO Recommendation on the Ethics of Neurotechnology, to holistically address both neural and cognitive biometric data. Incorporating this broader and more inclusive approach into legislation and product design can facilitate responsible innovation while safeguarding individuals' mental privacy."
