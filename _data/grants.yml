# Grant schemes offered by EEG101.
# Update status, deadline, and application_url when new rounds open.
# status options: open | closed | upcoming | tbc

schemes:

  - id: stsm
    title: "Short-Term Scientific Mission"
    short_title: "STSM"
    icon: "🔬"
    summary: >
      Funded research visits to a host institution within the EEG101 network.
      STSMs support knowledge exchange, skill development, and collaborative
      projects addressing community-identified challenges.
    eligibility: >
      Open to EEG101 members affiliated with an institution in a COST Full or
      Cooperating Member country or a Near Neighbour Country. The host institution
      must be in a different country from yours, and its academic lead must be an
      EEG101 member.
    value: "Up to €4,000"
    duration: "Minimum 5 days, maximum 90 days"
    yri_track: true
    itc_track: true
    industry_track: true
    status: "closed"
    deadline: "All Year 1 funding has been allocated."
    round_label: "Round 2"
    application_url: ""
    guidance_url: "https://www.cost.eu/cost-actions-event/action-networking-tools/"
    contact: "eeg101costaction@gmail.com"
    notes: >
      All Year 1 STSM funding has been allocated. Visit our Spotlight page to follow
      the funded projects. Check back from November onwards for Year 2 funding calls.

  - id: vmg
    title: "Virtual Mobility Grant"
    short_title: "VMG"
    icon: "💻"
    summary: >
      Grants to support virtual research collaborations between EEG101 network
      members. VMGs are particularly suited to researchers who cannot travel,
      including those with caring responsibilities or disabilities.
    eligibility: >
      Open to EEG101 members affiliated with an institution in a COST Full or
      Cooperating Member country or a Near Neighbour Country. The collaboration must
      involve at least one institution other than your own. Not for tasks that are
      part of a leadership role in EEG101.
    value: "Up to €1,500"
    duration: "1 to 90 days (virtual)"
    yri_track: true
    itc_track: true
    industry_track: true
    status: "closed"
    deadline: "All Year 1 funding has been allocated."
    round_label: "Round 2"
    application_url: ""
    guidance_url: "https://www.cost.eu/cost-actions-event/action-networking-tools/#Virtual-Networking-Tools"
    contact: "eeg101costaction@gmail.com"
    notes: >
      All Year 1 VMG funding has been allocated. Visit our Spotlight page to follow
      the funded projects. Check back from November onwards for Year 2 funding calls.

  - id: itc-conference
    title: "ITC Conference Grant"
    short_title: "ITC Conference Grant"
    icon: "🎤"
    summary: >
      Supports an oral presentation of your own work, within the scope of EEG101,
      at a high-level conference organised by others (not by EEG101 or another
      COST Action).
    eligibility: >
      Open to EEG101 members affiliated with an institution in an Inclusiveness
      Target Country (ITC) or a Near Neighbour Country. Oral presentations only.
    value: "Up to €2,500 in person, or €500 online"
    duration: "Conference duration"
    yri_track: false
    itc_track: true
    industry_track: false
    status: "closed"
    deadline: "All Year 1 funding has been allocated."
    round_label: "Round 2"
    application_url: ""
    guidance_url: "https://www.cost.eu/cost-actions-event/action-networking-tools/#h-conference-grants"
    contact: "eeg101costaction@gmail.com"
    notes: >
      All Year 1 Conference Grant funding has been allocated. Visit our Spotlight page
      to follow the funded projects. Check back from November onwards for Year 2 funding calls.

  - id: yri-conference
    title: "YRI Conference Grant"
    short_title: "YRI Conference Grant"
    icon: "🌱"
    summary: >
      Supports a poster or oral presentation of your own work, within the scope of
      EEG101, at a high-level conference organised by others (not by EEG101 or
      another COST Action).
    eligibility: >
      Open to EEG101 members who are Young Researchers and Innovators (under 40),
      affiliated with an institution in a COST Full or Cooperating Member country
      or a Near Neighbour Country.
    value: "Up to €2,500 in person, or €500 online"
    duration: "Conference duration"
    yri_track: true
    itc_track: false
    industry_track: false
    status: "closed"
    deadline: "Opens with the Year 2 funding call."
    round_label: "Round 2"
    application_url: ""
    guidance_url: "https://www.cost.eu/cost-actions-event/action-networking-tools/#h-conference-grants"
    contact: "eeg101costaction@gmail.com"
    notes: >
      New for Year 2. Check back from November onwards for Year 2 funding calls.

  - id: dissemination-conference
    title: "Dissemination Conference Grant"
    short_title: "Dissemination Conference Grant"
    icon: "📣"
    summary: >
      Supports an oral presentation of the work and results of EEG101 itself at a
      high-level conference organised by others, to bring the Action to new
      audiences and stakeholders.
    eligibility: >
      Open to EEG101 members affiliated with an institution in a COST Full or
      Cooperating Member country or a Near Neighbour Country. The presentation must
      be about the Action's work and fit its Science Communication Plan.
    value: "Up to €2,500 in person, or €500 online"
    duration: "Conference duration"
    yri_track: true
    itc_track: true
    industry_track: false
    status: "closed"
    deadline: "Opens with the Year 2 funding call."
    round_label: "Round 2"
    application_url: ""
    guidance_url: "https://www.cost.eu/cost-actions-event/action-networking-tools/#h-conference-grants"
    contact: "eeg101costaction@gmail.com"
    notes: >
      New for Year 2. Check back from November onwards for Year 2 funding calls.

# Application process steps (shown on Grants page)
application_process:
  - step: 1
    title: "Check eligibility"
    description: "Read the scheme requirements and the COST rules below. You must be an EEG101 member, at an institution in a COST Full or Cooperating Member country or a Near Neighbour Country."
  - step: 2
    title: "Agree your visit or project"
    description: "For an STSM, agree the work plan and dates with a host in another country. For a conference grant, have your abstract submitted or accepted."
  - step: 3
    title: "Apply"
    description: "Apply through the EEG101 application form while a call is open, and submit the same application in e-COST (e-services.cost.eu/action/CA24148/working-groups/apply), with your CV uploaded to your e-COST profile."
  - step: 4
    title: "Await decision"
    description: "Applications are reviewed by the grants committee, coordinated by the Grant Awarding Coordinator. Decisions are communicated within 4 weeks of the deadline, and successful applicants receive a grant letter."
  - step: 5
    title: "Carry out your mission"
    description: "Complete your STSM or VMG, or give your presentation, as approved. STSM grantees can ask for up to 50% of the grant in advance."
  - step: 6
    title: "Submit report"
    description: "Report in e-COST within 30 days of the end of your activity, or within 15 days of the end of the grant period if that comes first. The grant is paid once your report is approved."
