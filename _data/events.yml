# Events — categorised automatically at build time based on date.
# Events with dates in the future → Upcoming
# Events within the last 30 days → Recent
# Everything else → Past
# format options: in-person | online | hybrid
# category options: Announcement | Events | Grants
# Optional booking fields: booking_enabled, booking_status (open|closed), capacity,
# timezone, timezone_label, end_time and short_name (names the event's tab in the
# private registration workbook, e.g. "Diversity in EEG populations (2026-11-20)").
# Times are shown on cards as time–end_time plus timezone_label.
# audience: open (default; public booking, and the form notes that EEG101
# membership is not required) or members (COST members only: no booking on the
# site; the card shows "How to attend", explaining that invitations are sent
# through e-COST, and directs non-members to the Join page. Leave the booking
# fields and joining_link out for members-only events).
# joining_link (optional): the online meeting link. Once pushed, it is emailed
# automatically, within the hour, to everyone already booked, and included in all
# later confirmations. This file is public, so for a link that must stay private
# leave joining_link out and add it on the "Joining links" tab of the
# registration workbook instead (a link there takes precedence). An event's Events card and calendar popover both
# read these fields directly, so booking can never be created as a separate list.
# external: true marks an event run by another organisation rather than EEG101
# itself (registration, if any, happens on that organisation's own website via
# registration_url). It shows an "External event" badge so it reads differently
# from EEG101's own bookable events; leave it out for EEG101 events.

