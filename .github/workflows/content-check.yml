name: Check content saved in the website editor

# Runs after anything is saved through Pages CMS (or pushed by hand) to the
# content staff edit. GitHub Pages publishes main as it is, so this cannot stop a
# save from going live; what it does is catch problems quickly and tell the
# admins in plain English, and fix the one thing staff cannot be expected to:
# oversized, sideways, location-tagged photos.
#
#   1. Saved content is tidied and committed back: front matter is rewritten
#      so Jekyll reads times and yes/no words as typed
#      (scripts/normalise_front_matter.cjs), and pictures added since the last
#      tidy-up (tag content-tidied) are shrunk, turned upright and stripped of
#      metadata (scripts/optimise_images.py). Pictures from before this was set
#      up are never touched.
#   2. The content is checked (scripts/validate_event_booking.py) and the editor
#      config is checked against it (scripts/check_cms_config.py).
#   3. The site is built with the same builder GitHub Pages uses.
#   4. If any of these fails, an issue labelled "content-check" is opened (or updated)
#      for the admins; when a later save passes, it is closed automatically.
#
# See docs/pages-cms-setup.md.

on:
  push:
    branches: [main]
    paths:
      - "_events/**"
      - "_dates/**"
      - "_spotlights/**"
      - "_data/site.yml"
      - "assets/images/events/**"
      - "assets/images/spotlights/**"
      - ".pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: content-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyyaml pillow
          # The same YAML library (and major version) Pages CMS writes with.
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/yaml" yaml@2.9.1
          echo "NODE_PATH=$RUNNER_TEMP/yaml/node_modules" >> "$GITHUB_ENV"

      - name: Tidy what was saved (time formats, picture sizes)
        id: tidy
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          start=$(git rev-parse HEAD)
          # Front matter: every content file, every time. It is quick, and a file
          # already in the right form is left alone, so nothing is ever missed.
          mapfile -d '' -t pages < <(git ls-files -z -- '_events/*.md' '_dates/*.md' '_spotlights/*.md')
          # Pictures: everything added or changed since the last tidied commit, so
          # a save whose own run was dropped from the queue (GitHub keeps only the
          # newest waiting run) is still covered. Without that marker, only this
          # push; a manual run with neither leaves pictures alone.
          git fetch --quiet --force origin 'refs/tags/content-tidied:refs/tags/content-tidied' 2>/dev/null || true
          base=""
          if git rev-parse --verify --quiet 'refs/tags/content-tidied^{commit}' >/dev/null && git merge-base --is-ancestor refs/tags/content-tidied HEAD; then
            base=$(git rev-parse 'refs/tags/content-tidied^{commit}')
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          pictures=()
          if [ -n "$base" ]; then
            mapfile -d '' -t pictures < <(git diff -z --name-only --diff-filter=AMR "$base" HEAD -- assets/images/events assets/images/spotlights)
          fi
          : > tidied.txt
          # Pages CMS writes YAML 1.2; Jekyll reads 1.1, where 09:00 is a number and
          # "no" is false. Rewrite the front matter so Jekyll reads what was typed.
          if [ "${#pages[@]}" -gt 0 ]; then node scripts/normalise_front_matter.cjs "${pages[@]}" | tee -a tidied.txt; fi
          if [ "${#pictures[@]}" -gt 0 ]; then python3 scripts/optimise_images.py "${pictures[@]}" | tee -a tidied.txt; fi
          # Drafts are left out of the site, so the drafts page reads copies of them.
          python3 scripts/export_drafts.py | tee -a tidied.txt
          if [ -n "$(git status --porcelain -- _events _dates _spotlights assets/images/events assets/images/spotlights _data/drafts.yml)" ]; then
            git config user.name "EEG101 content check"
            git config user.email "eeg101costaction@gmail.com"
            git add -u -- _events _dates _spotlights assets/images/events assets/images/spotlights
            git add -- _data/drafts.yml
            git commit -m "Tidy content saved through the website editor" -m "$(grep -v '^::' tidied.txt || true)"
            bash scripts/push_to_main.sh
          else
            echo "Nothing needed tidying."
          fi
          # Everything up to the commit this run started from has now been tidied.
          git push --quiet --force origin "$start:refs/tags/content-tidied"

      - name: Check the content
        id: validate
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          { python3 scripts/validate_event_booking.py && python3 scripts/check_cms_config.py; } 2>&1 | tee validation.txt

      - name: Build the site exactly as GitHub Pages does
        id: build
        if: always()
        continue-on-error: true
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_check

      - name: List drafts waiting for review
        if: always()
        continue-on-error: true
        run: python3 scripts/export_drafts.py --review-json review.json

      # Marking a draft "Ready for review" opens an issue that @mentions the
      # reviewers in _data/site.yml (GitHub emails them); publishing it, unticking
      # "Ready for review" or deleting it closes the issue.
      - name: Open or close review requests
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          # Lets the booking Apps Script email the reviewers (docs/pages-cms-setup.md).
          REVIEW_EMAIL_TOKEN: ${{ secrets.EEG101_REVIEW_TOKEN }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/review_requests.cjs`);
            await run({ github, context, core, file: 'review.json' });

      - name: Tell the admins
        if: always()
        uses: actions/github-script@v7
        env:
          TIDY: ${{ steps.tidy.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          BUILD: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const label = 'content-check';
            const tidyOk = process.env.TIDY === 'success';
            const validateOk = process.env.VALIDATE === 'success';
            const buildOk = process.env.BUILD === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label })).data;

            if (tidyOk && validateOk && buildOk) {
              for (const issue of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `Fixed: the content saved in [${context.sha.slice(0, 7)}](${commit}) passes every check and the site builds. Closing.` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            const detail = fs.existsSync('validation.txt') ? fs.readFileSync('validation.txt', 'utf8').trim() : '';
            const problems = detail.split('\n').filter(l => l.startsWith('- ')).join('\n');
            const lines = [
              buildOk
                ? '**The website is up, but something just saved needs fixing.** It is already live, so please fix it soon.'
                : '**The website could not be rebuilt after the last save.** Visitors still see the previous version, so nothing is broken for them, but nothing new will appear until this is fixed.',
              '',
              validateOk ? '' : '### What is wrong\n\n' + (problems || '```\n' + detail.slice(0, 3000) + '\n```'),
              buildOk ? '' : '### The build failed\n\nThe details are in the log of the run below (look for the red step).',
              tidyOk ? '' : '### The automatic tidy-up failed\n\nTimes and pictures saved recently may not have been tidied (see the "Tidy what was saved" step in the log below). Re-running this check from the Actions tab retries it.',
              '',
              '### How to fix it',
              '',
              '- Open the item in the website editor (https://app.pagescms.org), correct it as described above, and save again. This issue closes by itself once a save passes.',
              '- If you cannot tell what to change, an admin can undo the save from the commit link below ("Revert").',
              '',
              `Save: [${context.sha.slice(0, 7)}](${commit}) · Full log: ${run}`,
            ].filter((l, i, a) => !(l === '' && a[i - 1] === ''));
            const body = lines.join('\n');

            try { await github.rest.issues.getLabel({ ...context.repo, name: label }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a', description: 'A save in the website editor needs fixing' }); }

            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: '**Still failing after another save.**\n\n' + body });
            } else {
              await github.rest.issues.create({ ...context.repo, labels: [label],
                title: buildOk ? 'Website editor: a saved item needs fixing' : 'Website editor: the site could not be rebuilt after a save',
                body });
            }
            core.setFailed('Content check failed; an issue has been opened for the admins.');
