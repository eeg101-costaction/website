name: Sync eCOST membership to Network Map

on:
  workflow_dispatch:
  schedule:
    - cron: "17 05 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ecost-network-map-sync
  cancel-in-progress: false

jobs:
  sync-network-map:
    name: Export eCOST membership and stage map update
    runs-on: ubuntu-latest
    env:
      ECOST_EMAIL: ${{ secrets.ECOST_EMAIL }}
      ECOST_PASSWORD: ${{ secrets.ECOST_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      ACTION_ID: CA24148
      UPDATE_BRANCH: automation/ecost-network-map-sync
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-ecost-sync.txt
          python -m playwright install --with-deps chromium

      - name: Download the detailed eCOST member export
        run: |
          mkdir -p .tmp/ecost-sync
          python scripts/ecost_export.py \
            --action-id "$ACTION_ID" \
            --output ".tmp/ecost-sync/${ACTION_ID}-WG-members.xlsx"

      - name: Write raw export to Members Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MEMBERS_SHEET_ID: ${{ secrets.MEMBERS_SHEET_ID }}
        run: |
          python scripts/write_to_sheet.py \
            --input ".tmp/ecost-sync/${ACTION_ID}-WG-members.xlsx" \
            --sheet-id "$MEMBERS_SHEET_ID"

      - name: Validate and build a staged map update
        id: map_sync
        run: |
          python scripts/sync_network_map.py \
            --input ".tmp/ecost-sync/${ACTION_ID}-WG-members.xlsx" \
            --existing assets/data/network-map.json \
            --output assets/data/network-map.json \
            --report .tmp/ecost-sync/report.json \
            --geocode-missing
          if git diff --quiet -- assets/data/network-map.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecost-network-map-report
          path: .tmp/ecost-sync/report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Push map update to main
        if: steps.map_sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "EEG101 eCOST synchronisation"
          git config user.email "eeg101costaction@gmail.com"
          git add assets/data/network-map.json
          git commit -m "Synchronise Network Map from eCOST export"
          git push origin main

      - name: Record no-change outcome
        if: steps.map_sync.outputs.changed == 'false'
        run: echo "The latest eCOST export produced no Network Map data changes."
